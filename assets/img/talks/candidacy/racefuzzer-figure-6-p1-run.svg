<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 704" width="1440" height="704" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <!-- AIDEV-NOTE: candidacy page only (RaceFuzzer, P1 walk-through). Same layout as racefuzzer-figure-5-p4-run.svg. -->
  <rect width="1440" height="704" fill="#ffffff"/>
  <text x="42" y="48" font-size="26" fill="#1f1f1f" font-weight="600">RaceFuzzer on P1 (m1, w6): the partner never comes</text>
  <text x="42" y="82" font-size="19" fill="#555">RaceSet = {m1, w6}. One seed&#x27;s run, step by step; time runs down.</text>
  <text x="70" y="162" font-size="20" fill="#1f1f1f" font-weight="600" text-anchor="middle">Step</text>
  <text x="290.0" y="162" font-size="21" fill="#1f1f1f" font-weight="600" text-anchor="middle">Thread M</text>
  <text x="680.0" y="162" font-size="21" fill="#1f1f1f" font-weight="600" text-anchor="middle">Thread W</text>
  <text x="900" y="162" font-size="21" fill="#1f1f1f" font-weight="600">Scheduler</text>
  <line x1="42" y1="178" x2="1400" y2="178" stroke="#b5b4a8" stroke-width="2"/>
  <text x="70" y="242" font-size="20" fill="#555" text-anchor="middle">1</text>
  <rect x="110" y="204" width="360" height="64" rx="10" fill="#fff8e8" stroke="#b07c12" stroke-width="2.5"/>
  <text x="126" y="234" font-size="17" fill="#555" font-weight="700">m1</text>
  <text x="190" y="234" font-size="17" fill="#1f1f1f" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">cfg = new Config(10);</text>
  <text x="126" y="257" font-size="15" fill="#b07c12" font-weight="700">postponed here</text>
  <text x="900" y="230" font-size="17" fill="#1f1f1f">m1 is in RaceSet and no partner is</text>
  <text x="900" y="254" font-size="17" fill="#1f1f1f">postponed yet: postpone M.</text>
  <line x1="42" y1="282" x2="1400" y2="282" stroke="#e4e3dc" stroke-width="1.5"/>
  <text x="70" y="334" font-size="20" fill="#555" text-anchor="middle">2</text>
  <rect x="110" y="296" width="360" height="64" rx="10" fill="#fff8e8" stroke="#b07c12" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="290.0" y="334" font-size="17" fill="#b07c12" font-weight="600" text-anchor="middle">postponed at m1</text>
  <rect x="500" y="296" width="360" height="64" rx="10" fill="#fff" stroke="#cfcec6" stroke-width="2"/>
  <text x="516" y="326" font-size="17" fill="#555" font-weight="700">w1–w4</text>
  <text x="580" y="326" font-size="17" fill="#1f1f1f" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">…  r = ready;</text>
  <text x="900" y="322" font-size="17" fill="#1f1f1f">W runs and reads ready == false,</text>
  <text x="900" y="346" font-size="17" fill="#1f1f1f">because M never got to set it.</text>
  <line x1="42" y1="374" x2="1400" y2="374" stroke="#e4e3dc" stroke-width="1.5"/>
  <text x="70" y="426" font-size="20" fill="#555" text-anchor="middle">3</text>
  <rect x="110" y="388" width="360" height="64" rx="10" fill="#fff8e8" stroke="#b07c12" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="290.0" y="426" font-size="17" fill="#b07c12" font-weight="600" text-anchor="middle">postponed at m1</text>
  <rect x="500" y="388" width="360" height="64" rx="10" fill="#f4f4f2" stroke="#8a8a80" stroke-width="2" stroke-dasharray="4 5"/>
  <text x="516" y="418" font-size="17" fill="#555" font-weight="700">w6</text>
  <text x="580" y="418" font-size="17" fill="#8a8a80" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">n = cfg.max;</text>
  <text x="516" y="441" font-size="15" fill="#8a8a80" font-weight="700">skipped: never executed</text>
  <text x="900" y="414" font-size="17" fill="#1f1f1f">r is false, so W skips w6,</text>
  <text x="900" y="438" font-size="17" fill="#1f1f1f">runs w7–w8 and finishes.</text>
  <line x1="42" y1="466" x2="1400" y2="466" stroke="#e4e3dc" stroke-width="1.5"/>
  <text x="70" y="518" font-size="20" fill="#555" text-anchor="middle">4</text>
  <rect x="110" y="480" width="360" height="64" rx="10" fill="#fff" stroke="#cfcec6" stroke-width="2"/>
  <text x="126" y="510" font-size="17" fill="#555" font-weight="700">m1–m6</text>
  <text x="190" y="510" font-size="17" fill="#1f1f1f" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">…  log = null;</text>
  <text x="680.0" y="518" font-size="17" fill="#8a8a80" font-weight="600" text-anchor="middle">finished</text>
  <text x="900" y="506" font-size="17" fill="#1f1f1f">Everyone enabled is postponed, so M</text>
  <text x="900" y="530" font-size="17" fill="#1f1f1f">is released and runs to the end.</text>
  <line x1="42" y1="558" x2="1400" y2="558" stroke="#e4e3dc" stroke-width="1.5"/>
  <rect x="42" y="582" width="1358" height="92" rx="12" fill="#e6f4ea" stroke="#2b8a3e" stroke-width="2.5"/>
  <text x="66" y="618" font-size="19" fill="#2b8a3e" font-weight="700">No race reported: the threads can never meet</text>
  <text x="66" y="648" font-size="18" fill="#1f1f1f">W can only reach w6 after m3, and m3 comes after m1. 0 of 2,000 seeds reported a race, so P1 is not confirmed.</text>
</svg>
