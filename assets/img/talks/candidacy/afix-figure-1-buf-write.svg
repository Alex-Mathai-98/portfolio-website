<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 1076" width="1360" height="1076" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <!-- AIDEV-NOTE: candidacy page only (AFix Figure 1). Code of buf_write with the reported accesses (redrawn from the
       post's 01-apache-buf-write.png) plus the schedule behind each report; values (buf_len 10, 5/8-byte appends) are illustrative. -->
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f1f1f"/></marker></defs>
  <rect width="1360" height="1076" fill="#ffffff"/>
  <text x="42" y="48" font-size="26" fill="#1f1f1f" font-weight="600">Apache buf_write: two reported atomicity violations, and the schedules behind them</text>
  <text x="42" y="82" font-size="18" fill="#555">Top: the code both threads run, with the accesses each report names. Bottom: the schedule behind each report.</text>
  <rect x="42" y="110" width="620" height="352" rx="14" fill="#fff" stroke="#cfcec6" stroke-width="2"/>
  <text x="68" y="146" font-size="21" fill="#1f1f1f" font-weight="700">Thread 1</text>
  <text x="74" y="185" font-size="17" fill="#666">1</text>
  <text x="118" y="185" font-size="17" fill="#1f1f1f" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">void buf_write(...) {</text>
  <rect x="54" y="198" width="596" height="34" rx="6" fill="#eaf2fd"/>
  <text x="638" y="221" font-size="17" fill="#2f7bd6" font-weight="600" text-anchor="end">p of A</text>
  <text x="74" y="221" font-size="17" fill="#666">2</text>
  <text x="138" y="221" font-size="17" fill="#1f1f1f" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">int tmp = buf_len + str_len;</text>
  <text x="74" y="257" font-size="17" fill="#666">3</text>
  <text x="138" y="257" font-size="17" fill="#1f1f1f" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">if (tmp &gt; MAX)</text>
  <text x="74" y="293" font-size="17" fill="#666">4</text>
  <text x="158" y="293" font-size="17" fill="#1f1f1f" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">return;</text>
  <rect x="54" y="306" width="596" height="34" rx="6" fill="#efefec"/>
  <text x="638" y="329" font-size="17" fill="#1f9d6b" font-weight="600" text-anchor="end">p of B</text>
  <text x="562" y="329" font-size="17" fill="#2f7bd6" font-weight="600" text-anchor="end">c of A</text>
  <text x="74" y="329" font-size="17" fill="#666">6</text>
  <text x="138" y="329" font-size="17" fill="#1f1f1f" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">memcpy(buf[buf_len],</text>
  <text x="74" y="365" font-size="17" fill="#666">7</text>
  <text x="198" y="365" font-size="17" fill="#1f1f1f" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">str, str_len);</text>
  <rect x="54" y="378" width="596" height="34" rx="6" fill="#e9f7f0"/>
  <text x="638" y="401" font-size="17" fill="#1f9d6b" font-weight="600" text-anchor="end">c of B</text>
  <text x="74" y="401" font-size="17" fill="#666">8</text>
  <text x="138" y="401" font-size="17" fill="#1f1f1f" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">buf_len = tmp;</text>
  <text x="74" y="437" font-size="17" fill="#666">9</text>
  <text x="118" y="437" font-size="17" fill="#1f1f1f" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">}</text>
  <rect x="698" y="110" width="620" height="352" rx="14" fill="#fff" stroke="#cfcec6" stroke-width="2"/>
  <text x="724" y="146" font-size="21" fill="#1f1f1f" font-weight="700">Thread 2</text>
  <text x="730" y="185" font-size="17" fill="#666">1</text>
  <text x="774" y="185" font-size="17" fill="#1f1f1f" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">void buf_write(...) {</text>
  <text x="730" y="221" font-size="17" fill="#666">2</text>
  <text x="794" y="221" font-size="17" fill="#1f1f1f" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">int tmp = buf_len + str_len;</text>
  <text x="730" y="257" font-size="17" fill="#666">3</text>
  <text x="794" y="257" font-size="17" fill="#1f1f1f" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">if (tmp &gt; MAX)</text>
  <text x="730" y="293" font-size="17" fill="#666">4</text>
  <text x="814" y="293" font-size="17" fill="#1f1f1f" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">return;</text>
  <text x="730" y="329" font-size="17" fill="#666">6</text>
  <text x="794" y="329" font-size="17" fill="#1f1f1f" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">memcpy(buf[buf_len],</text>
  <text x="730" y="365" font-size="17" fill="#666">7</text>
  <text x="854" y="365" font-size="17" fill="#1f1f1f" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">str, str_len);</text>
  <rect x="710" y="378" width="596" height="34" rx="6" fill="#efefec"/>
  <text x="1294" y="401" font-size="17" fill="#d1342f" font-weight="600" text-anchor="end">r of A and B</text>
  <text x="730" y="401" font-size="17" fill="#666">8</text>
  <text x="794" y="401" font-size="17" fill="#1f1f1f" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">buf_len = tmp;</text>
  <text x="730" y="437" font-size="17" fill="#666">9</text>
  <text x="774" y="437" font-size="17" fill="#1f1f1f" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">}</text>
  <text x="42" y="522" font-size="17" fill="#555">Both threads start with buf_len = 10. Only the reported lines are shown (T2 runs its lines 2–6 just before its line 8).</text>
  <text x="42" y="564" font-size="21" fill="#2f7bd6" font-weight="700">A · report (p, c, r) = (2, 6, 8)</text>
  <text x="192" y="610" font-size="17" fill="#1f1f1f" font-weight="600" text-anchor="middle">Thread 1 (appends 5 bytes)</text>
  <text x="512" y="610" font-size="17" fill="#1f1f1f" font-weight="600" text-anchor="middle">Thread 2 (appends 8 bytes)</text>
  <line x1="192" y1="624" x2="192" y2="974" stroke="#d6d5ce" stroke-width="2" stroke-dasharray="4 6"/>
  <line x1="512" y1="624" x2="512" y2="974" stroke="#d6d5ce" stroke-width="2" stroke-dasharray="4 6"/>
  <rect x="42" y="640" width="300" height="92" rx="10" fill="#eaf2fd" stroke="#2f7bd6" stroke-width="2.2"/>
  <text x="56" y="668" font-size="15" fill="#777" font-weight="700">1</text>
  <text x="78" y="668" font-size="15" fill="#555" font-weight="700">line 2</text>
  <text x="328" y="668" font-size="17" fill="#2f7bd6" font-weight="700" text-anchor="end">p</text>
  <text x="56" y="696" font-size="15" fill="#1f1f1f" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">int tmp = buf_len + str_len;</text>
  <text x="56" y="720" font-size="15" fill="#444">tmp = 10 + 5 = 15: check passes</text>
  <rect x="362" y="752" width="300" height="92" rx="10" fill="#fdeeee" stroke="#d1342f" stroke-width="2.2"/>
  <text x="376" y="780" font-size="15" fill="#777" font-weight="700">2</text>
  <text x="398" y="780" font-size="15" fill="#555" font-weight="700">line 8</text>
  <text x="648" y="780" font-size="17" fill="#d1342f" font-weight="700" text-anchor="end">r</text>
  <text x="376" y="808" font-size="15" fill="#1f1f1f" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">buf_len = tmp;</text>
  <text x="376" y="832" font-size="15" fill="#444">T2 grows the log: buf_len = 18</text>
  <rect x="42" y="864" width="300" height="92" rx="10" fill="#eaf2fd" stroke="#2f7bd6" stroke-width="2.2"/>
  <text x="56" y="892" font-size="15" fill="#777" font-weight="700">3</text>
  <text x="78" y="892" font-size="15" fill="#555" font-weight="700">line 6</text>
  <text x="328" y="892" font-size="17" fill="#2f7bd6" font-weight="700" text-anchor="end">c</text>
  <text x="56" y="920" font-size="15" fill="#1f1f1f" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">memcpy(buf[buf_len], str, 5);</text>
  <text x="56" y="944" font-size="15" fill="#444">writes bytes 18–22, past the checked 15</text>
  <line x1="342" y1="710" x2="362" y2="774" stroke="#1f1f1f" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="362" y1="822" x2="342" y2="886" stroke="#1f1f1f" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="42" y="984" width="620" height="62" rx="10" fill="#fff" stroke="#d1342f" stroke-width="2.2"/>
  <text x="60" y="1022" font-size="17" fill="#d1342f" font-weight="700">Crash: the copy goes past the size that was checked</text>
  <text x="698" y="564" font-size="21" fill="#1f9d6b" font-weight="700">B · report (p, c, r) = (6, 8, 8)</text>
  <text x="848" y="610" font-size="17" fill="#1f1f1f" font-weight="600" text-anchor="middle">Thread 1 (appends 5 bytes)</text>
  <text x="1168" y="610" font-size="17" fill="#1f1f1f" font-weight="600" text-anchor="middle">Thread 2 (appends 8 bytes)</text>
  <line x1="848" y1="624" x2="848" y2="974" stroke="#d6d5ce" stroke-width="2" stroke-dasharray="4 6"/>
  <line x1="1168" y1="624" x2="1168" y2="974" stroke="#d6d5ce" stroke-width="2" stroke-dasharray="4 6"/>
  <rect x="698" y="640" width="300" height="92" rx="10" fill="#e9f7f0" stroke="#1f9d6b" stroke-width="2.2"/>
  <text x="712" y="668" font-size="15" fill="#777" font-weight="700">1</text>
  <text x="734" y="668" font-size="15" fill="#555" font-weight="700">line 6</text>
  <text x="984" y="668" font-size="17" fill="#1f9d6b" font-weight="700" text-anchor="end">p</text>
  <text x="712" y="696" font-size="15" fill="#1f1f1f" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">memcpy(buf[buf_len], str, 5);</text>
  <text x="712" y="720" font-size="15" fill="#444">T1 copies at buf_len = 10</text>
  <rect x="1018" y="752" width="300" height="92" rx="10" fill="#fdeeee" stroke="#d1342f" stroke-width="2.2"/>
  <text x="1032" y="780" font-size="15" fill="#777" font-weight="700">2</text>
  <text x="1054" y="780" font-size="15" fill="#555" font-weight="700">line 8</text>
  <text x="1304" y="780" font-size="17" fill="#d1342f" font-weight="700" text-anchor="end">r</text>
  <text x="1032" y="808" font-size="15" fill="#1f1f1f" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">buf_len = tmp;</text>
  <text x="1032" y="832" font-size="15" fill="#444">T2 grows the log: buf_len = 18</text>
  <rect x="698" y="864" width="300" height="92" rx="10" fill="#e9f7f0" stroke="#1f9d6b" stroke-width="2.2"/>
  <text x="712" y="892" font-size="15" fill="#777" font-weight="700">3</text>
  <text x="734" y="892" font-size="15" fill="#555" font-weight="700">line 8</text>
  <text x="984" y="892" font-size="17" fill="#1f9d6b" font-weight="700" text-anchor="end">c</text>
  <text x="712" y="920" font-size="15" fill="#1f1f1f" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">buf_len = tmp;</text>
  <text x="712" y="944" font-size="15" fill="#444">T1 writes back its stale tmp: 15</text>
  <line x1="998" y1="710" x2="1018" y2="774" stroke="#1f1f1f" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="1018" y1="822" x2="998" y2="886" stroke="#1f1f1f" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="698" y="984" width="620" height="62" rx="10" fill="#fff" stroke="#d1342f" stroke-width="2.2"/>
  <text x="716" y="1022" font-size="17" fill="#d1342f" font-weight="700">Corrupted log: T2&#x27;s update to buf_len is lost</text>
</svg>
