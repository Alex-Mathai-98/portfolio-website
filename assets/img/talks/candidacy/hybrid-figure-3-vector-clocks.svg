<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1410 1068" width="1410" height="1068" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <!-- AIDEV-NOTE: candidacy page only: vertical redraw of the post's 05-vector-clocks.png (Hybrid section Figure 3). Generated by a script. Green = cfg pair (ordered), purple = clock pair (shared lock), red = hits pair. -->
  <defs>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f7bd6"/></marker>
    <marker id="ah-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8f8e84"/></marker>
  </defs>
  <rect width="1410" height="1068" fill="#ffffff"/>
  <text x="42" y="48" font-size="26" fill="#1f1f1f" font-weight="600">W has heard of M only up to 1: M1 is ordered before W1, M4 and M5 are not</text>
  <text x="42" y="82" font-size="19" fill="#555">Clocks are (M-entry, W-entry). A clock changes only when its thread sends or receives a message.</text>
  <text x="330" y="138" font-size="22" fill="#1f1f1f" font-weight="700" text-anchor="middle">Main thread (M)</text>
  <text x="930" y="138" font-size="22" fill="#1f1f1f" font-weight="700" text-anchor="middle">Worker thread (W)</text>
  <line x1="330" y1="190" x2="930" y2="506" stroke="#2b8a3e" stroke-width="40" stroke-linecap="round" opacity="0.2"/>
  <line x1="330" y1="650" x2="930" y2="722" stroke="#7048e8" stroke-width="40" stroke-linecap="round" opacity="0.2"/>
  <line x1="330" y1="578" x2="930" y2="794" stroke="#d1342f" stroke-width="40" stroke-linecap="round" opacity="0.2"/>
  <line x1="330" y1="160" x2="330" y2="844" stroke="#c8c7bc" stroke-width="2"/>
  <line x1="930" y1="334" x2="930" y2="844" stroke="#c8c7bc" stroke-width="2"/>
  <line x1="330" y1="334" x2="918" y2="334" stroke="#2f7bd6" stroke-width="3" marker-end="url(#ah-blue)"/>
  <text x="610.0" y="360" font-size="18" fill="#444" text-anchor="middle">start message carries (1, 0)</text>
  <text x="346" y="304.0" font-size="18" fill="#2f7bd6" font-weight="600">clock (1, 0)</text>
  <text x="346" y="548.0" font-size="18" fill="#2f7bd6" font-weight="600">clock (2, 0)</text>
  <text x="914" y="384" font-size="18" fill="#2f7bd6" font-weight="600" text-anchor="end">clock (1, 1)</text>
  <g transform="rotate(27.8 786.0 430.2)">
    <rect x="676.2" y="418.2" width="219.6" height="24" rx="12" fill="#fff" opacity="0.92"/>
    <text x="786.0" y="435.7" font-size="15.5" font-weight="700" fill="#2b8a3e" text-anchor="middle">ordered: lockset skipped</text>
  </g>
  <g transform="rotate(6.8 480.0 668.0)">
    <rect x="378.6" y="656.0" width="202.8" height="24" rx="12" fill="#fff" opacity="0.92"/>
    <text x="480.0" y="673.5" font-size="15.5" font-weight="700" fill="#7048e8" text-anchor="middle">unordered, lock shared</text>
  </g>
  <g transform="rotate(19.8 780.0 740.0)">
    <rect x="670.2" y="728.0" width="219.6" height="24" rx="12" fill="#fff" opacity="0.92"/>
    <text x="780.0" y="745.5" font-size="15.5" font-weight="700" fill="#d1342f" text-anchor="middle">unordered, lockset empty</text>
  </g>
  <circle cx="330" cy="190" r="10" fill="#2b8a3e"/>
  <text x="306" y="188" font-size="20" fill="#1f1f1f" font-weight="700" text-anchor="end">M1 · write cfg</text>
  <text x="306" y="212" font-size="17" fill="#555" text-anchor="end">stamp 1</text>
  <circle cx="330" cy="262" r="10" fill="#c8c7bc"/>
  <text x="306" y="260" font-size="20" fill="#1f1f1f" font-weight="700" text-anchor="end">M2 · new Worker</text>
  <text x="306" y="284" font-size="17" fill="#555" text-anchor="end">no shared field</text>
  <circle cx="330" cy="334" r="10" fill="#c8c7bc"/>
  <text x="306" y="332" font-size="20" fill="#1f1f1f" font-weight="700" text-anchor="end">M3 · start()</text>
  <text x="306" y="356" font-size="17" fill="#555" text-anchor="end">send: M goes to 2</text>
  <circle cx="330" cy="578" r="10" fill="#d1342f"/>
  <text x="306" y="576" font-size="20" fill="#1f1f1f" font-weight="700" text-anchor="end">M4 · write hits</text>
  <text x="306" y="600" font-size="17" fill="#555" text-anchor="end">stamp 2</text>
  <circle cx="930" cy="334" r="10" fill="#c8c7bc"/>
  <text x="954" y="332" font-size="20" fill="#1f1f1f" font-weight="700">W begins</text>
  <text x="954" y="356" font-size="17" fill="#555">starts at (0, 1); receives (1, 0)</text>
  <circle cx="930" cy="506" r="10" fill="#2b8a3e"/>
  <text x="954" y="504" font-size="20" fill="#1f1f1f" font-weight="700">W1 · read cfg</text>
  <text x="954" y="528" font-size="17" fill="#555">knows M up to 1</text>
  <circle cx="330" cy="650" r="10" fill="#7048e8"/>
  <text x="306" y="648" font-size="20" fill="#1f1f1f" font-weight="700" text-anchor="end">M5 · write clock</text>
  <text x="306" y="672" font-size="17" fill="#555" text-anchor="end">stamp 2 · holds clockLock</text>
  <circle cx="930" cy="722" r="10" fill="#7048e8"/>
  <text x="954" y="720" font-size="20" fill="#1f1f1f" font-weight="700">W2 · write clock</text>
  <text x="954" y="744" font-size="17" fill="#555">knows M up to 1 · clockLock</text>
  <circle cx="930" cy="794" r="10" fill="#d1342f"/>
  <text x="954" y="792" font-size="20" fill="#1f1f1f" font-weight="700">W3 · read hits</text>
  <text x="954" y="816" font-size="17" fill="#555">knows M up to 1</text>
  <text x="954" y="390" font-size="17" fill="#1f1f1f">How W gets (1, 1) at W begins:</text>
  <text x="954" y="414" font-size="17" fill="#444">from (0, 1) and (1, 0) it keeps</text>
  <text x="954" y="438" font-size="17" fill="#444">the larger value of each entry.</text>
  <text x="954" y="462" font-size="17" fill="#444">W1, W2 and W3 all run at (1, 1).</text>
  <line x1="1230" y1="118" x2="1230" y2="844" stroke="#cfcec6" stroke-width="1.5"/>
  <text x="1260" y="138" font-size="22" fill="#1f1f1f" font-weight="700">Check?</text>
  <line x1="1230" y1="190" x2="1246" y2="190" stroke="#cfcec6" stroke-width="1.5"/>
  <text x="1260" y="196" font-size="18" fill="#666">No comparison</text>
  <line x1="1230" y1="262" x2="1246" y2="262" stroke="#cfcec6" stroke-width="1.5"/>
  <text x="1260" y="268" font-size="18" fill="#666">No</text>
  <line x1="1230" y1="334" x2="1246" y2="334" stroke="#cfcec6" stroke-width="1.5"/>
  <text x="1260" y="340" font-size="18" fill="#666">No</text>
  <line x1="1230" y1="506" x2="1246" y2="506" stroke="#cfcec6" stroke-width="1.5"/>
  <text x="1260" y="512" font-size="18" fill="#2b8a3e" font-weight="700">Yes · cfg</text>
  <line x1="1230" y1="578" x2="1246" y2="578" stroke="#cfcec6" stroke-width="1.5"/>
  <text x="1260" y="584" font-size="18" fill="#666">No comparison</text>
  <line x1="1230" y1="650" x2="1246" y2="650" stroke="#cfcec6" stroke-width="1.5"/>
  <text x="1260" y="656" font-size="18" fill="#666">No comparison</text>
  <line x1="1230" y1="722" x2="1246" y2="722" stroke="#cfcec6" stroke-width="1.5"/>
  <text x="1260" y="728" font-size="18" fill="#7048e8" font-weight="700">Yes · clock</text>
  <line x1="1230" y1="794" x2="1246" y2="794" stroke="#cfcec6" stroke-width="1.5"/>
  <text x="1260" y="800" font-size="18" fill="#d1342f" font-weight="700">Yes · hits</text>
  <rect x="42" y="874" width="426" height="164" rx="12" fill="none" stroke="#2b8a3e" stroke-width="2.5"/>
  <text x="62" y="908" font-size="18" fill="#2b8a3e" font-weight="700">M1, W1: ordered</text>
  <text x="62" y="936" font-size="18" fill="#1f1f1f">1 ≥ 1: W has heard of M1.</text>
  <text x="62" y="964" font-size="18" fill="#1f1f1f">Ordered, so the lockset check</text>
  <text x="62" y="992" font-size="18" fill="#1f1f1f">is skipped. No race.</text>
  <rect x="488" y="874" width="426" height="164" rx="12" fill="none" stroke="#7048e8" stroke-width="2.5"/>
  <text x="508" y="908" font-size="18" fill="#7048e8" font-weight="700">M5, W2: unordered</text>
  <text x="508" y="936" font-size="18" fill="#1f1f1f">1 &lt; 2: W has not heard of M5.</text>
  <text x="508" y="964" font-size="18" fill="#1f1f1f">Lockset: both hold clockLock,</text>
  <text x="508" y="992" font-size="18" fill="#1f1f1f">non-empty. No race.</text>
  <rect x="934" y="874" width="426" height="164" rx="12" fill="none" stroke="#d1342f" stroke-width="2.5"/>
  <text x="954" y="908" font-size="18" fill="#d1342f" font-weight="700">M4, W3: unordered</text>
  <text x="954" y="936" font-size="18" fill="#1f1f1f">1 &lt; 2: W has not heard of M4.</text>
  <text x="954" y="964" font-size="18" fill="#1f1f1f">Lockset: no common lock,</text>
  <text x="954" y="992" font-size="18" fill="#1f1f1f">empty. Race reported.</text>
</svg>
