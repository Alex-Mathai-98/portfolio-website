<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 600" width="1320" height="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <!-- AIDEV-NOTE: candidacy page only (Lamport 1.5). Same program, two schedules: the lock hand-off orders
       x = 1 before x = 2 in run A (race hidden) but not in run B (race reported). Colours match Figures 1-4. -->
  <defs>
    <marker id="ah-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c8c7bc"/></marker>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1c6dd0"/></marker>
    <marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker>
  </defs>
  <rect width="1320" height="600" fill="#ffffff"/>
  <text x="42" y="44" font-size="25" font-weight="600" fill="#1f1f1f">One race, two runs: happens-before only sees it when the run exposes it</text>
  <text x="42" y="76" font-size="19" fill="#555">Neither thread holds m around its write to x. Blue arrows are lock hand-offs (unlock, then the other thread's lock).</text>
  <text x="42" y="130" font-size="21" font-weight="700" fill="#1f1f1f">Run A: T1 takes the lock first</text>
  <g font-size="22" font-weight="700" fill="#1f1f1f"><text x="42" y="218">T1</text><text x="42" y="358">T2</text></g>
  <g stroke="#c8c7bc" stroke-width="2"><line x1="92" y1="210" x2="632" y2="210" marker-end="url(#ah-grey)"/><line x1="92" y1="350" x2="632" y2="350" marker-end="url(#ah-grey)"/></g>
  <g stroke="#d9480f" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.85">
    <line x1="150" y1="210" x2="360" y2="210"/><line x1="380" y1="350" x2="573" y2="350" marker-end="url(#ah-orange)"/>
  </g>
  <line x1="360" y1="216" x2="380" y2="340" stroke="#1c6dd0" stroke-width="3" marker-end="url(#ah-blue)"/>
  <rect x="240" y="197" width="120" height="26" rx="6" fill="#eef3fb" stroke="#1c6dd0" stroke-width="2"/>
  <text x="300.0" y="186" font-size="17" fill="#1c6dd0" font-weight="600" text-anchor="middle">lock(m) … unlock(m)</text>
  <rect x="380" y="337" width="120" height="26" rx="6" fill="#eef3fb" stroke="#1c6dd0" stroke-width="2"/>
  <text x="440.0" y="390" font-size="17" fill="#1c6dd0" font-weight="600" text-anchor="middle">lock(m) … unlock(m)</text>
  <circle cx="150" cy="210" r="10" fill="#d9480f"/><text x="150" y="186" font-size="20" font-weight="700" fill="#d9480f" text-anchor="middle">x = 1</text>
  <circle cx="585" cy="350" r="10" fill="#d9480f"/><text x="585" y="390" font-size="20" font-weight="700" fill="#d9480f" text-anchor="middle">x = 2</text>
  <text x="700" y="130" font-size="21" font-weight="700" fill="#1f1f1f">Run B: T2 takes the lock first</text>
  <g font-size="22" font-weight="700" fill="#1f1f1f"><text x="700" y="218">T1</text><text x="700" y="358">T2</text></g>
  <g stroke="#c8c7bc" stroke-width="2"><line x1="750" y1="210" x2="1290" y2="210" marker-end="url(#ah-grey)"/><line x1="750" y1="350" x2="1290" y2="350" marker-end="url(#ah-grey)"/></g>
  <ellipse cx="975.0" cy="280.0" rx="80" ry="132" fill="#7048e8" fill-opacity="0.08" stroke="#7048e8" stroke-width="2.5" stroke-dasharray="9 7"/>
  <line x1="900" y1="344" x2="1080" y2="220" stroke="#1c6dd0" stroke-width="3" marker-end="url(#ah-blue)"/>
  <rect x="1080" y="197" width="120" height="26" rx="6" fill="#eef3fb" stroke="#1c6dd0" stroke-width="2"/>
  <text x="1140.0" y="186" font-size="17" fill="#1c6dd0" font-weight="600" text-anchor="middle">lock(m) … unlock(m)</text>
  <rect x="780" y="337" width="120" height="26" rx="6" fill="#eef3fb" stroke="#1c6dd0" stroke-width="2"/>
  <text x="840.0" y="390" font-size="17" fill="#1c6dd0" font-weight="600" text-anchor="middle">lock(m) … unlock(m)</text>
  <circle cx="960" cy="210" r="10" fill="#7048e8"/><text x="960" y="186" font-size="20" font-weight="700" fill="#7048e8" text-anchor="middle">x = 1</text>
  <circle cx="990" cy="350" r="10" fill="#7048e8"/><text x="990" y="390" font-size="20" font-weight="700" fill="#7048e8" text-anchor="middle">x = 2</text>
  <rect x="42" y="452" width="598" height="120" rx="12" fill="none" stroke="#d9480f" stroke-width="2.5"/>
  <text x="66" y="488" font-size="18" font-weight="700" fill="#d9480f">No race reported</text>
  <text x="66" y="515" font-size="18" fill="#1f1f1f">x = 1 → unlock → lock → x = 2 is a happens-before path,</text>
  <text x="66" y="542" font-size="18" fill="#1f1f1f">so the two writes look ordered in this run.</text>
  <rect x="700" y="452" width="598" height="120" rx="12" fill="none" stroke="#7048e8" stroke-width="2.5"/>
  <text x="724" y="488" font-size="18" font-weight="700" fill="#7048e8">Race reported</text>
  <text x="724" y="515" font-size="18" fill="#1f1f1f">No path joins x = 1 and x = 2: T2 finished with m</text>
  <text x="724" y="542" font-size="18" fill="#1f1f1f">before T1 took it. The writes are concurrent.</text>
</svg>
