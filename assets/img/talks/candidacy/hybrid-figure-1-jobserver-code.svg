<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1432 884" width="1432" height="884" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <!-- AIDEV-NOTE: candidacy page only: simplified JobServer (cfg, hits, clock) for the Hybrid section, code and observed run in one figure. Generated by a script; labels M1-M5, W1-W3 match the post's labels for the same lines. -->
  <defs>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f7bd6"/></marker>
    <marker id="ah-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8f8e84"/></marker>
  </defs>
  <rect width="1432" height="884" fill="#ffffff"/>
  <text x="42" y="52" font-size="26" fill="#1f1f1f" font-weight="600">JobServer: the code, laid out as the observed run</text>
  <text x="42" y="86" font-size="19" fill="#555">Each statement sits on the row of its step, so time runs down. Under each statement: the events it emits.</text>
  <rect x="42" y="114" width="720" height="704" rx="12" fill="#fff" stroke="#cfcec6" stroke-width="2"/>
  <text x="68" y="156" font-size="22" fill="#1f1f1f" font-weight="700">Main thread (M)</text>
  <text x="68" y="188" font-size="19" fill="#555">Server.serve(): owns cfg, hits, clock</text>
  <line x1="42" y1="206" x2="762" y2="206" stroke="#cfcec6" stroke-width="1.5"/>
  <text x="68" y="244" font-size="17" fill="#6a737d">// cfg:   the paper&#x27;s globalFlag; written once before W starts, then only read</text>
  <text x="68" y="274" font-size="17" fill="#6a737d">// hits:  the paper&#x27;s globalInt; written by M and read by W with no lock</text>
  <text x="68" y="304" font-size="17" fill="#6a737d">// clock: the counter next to it, guarded by clockLock</text>
  <rect x="54" y="324" width="696" height="54" rx="6" fill="#fdf0d5"/>
  <circle cx="70" cy="343" r="15" fill="#fff" stroke="#cfcec6" stroke-width="2"/>
  <text x="70" y="349" font-size="16" fill="#555" text-anchor="middle">1</text>
  <text x="98" y="349" font-size="19" fill="#555" font-weight="600">M1</text>
  <text x="148" y="349" font-size="19" fill="#1f1f1f">cfg = Config.load();</text>
  <text x="148" y="371" font-size="16" fill="#666">MEM(cfg, WRITE)</text>
  <rect x="54" y="384" width="696" height="54" rx="6" fill="#ffffff"/>
  <circle cx="70" cy="403" r="15" fill="#fff" stroke="#cfcec6" stroke-width="2"/>
  <text x="70" y="409" font-size="16" fill="#555" text-anchor="middle">2</text>
  <text x="98" y="409" font-size="19" fill="#555" font-weight="600">M2</text>
  <text x="148" y="409" font-size="19" fill="#1f1f1f">Worker w = new Worker(this);</text>
  <text x="148" y="431" font-size="16" fill="#666">creates W (no shared field)</text>
  <rect x="54" y="444" width="696" height="54" rx="6" fill="#dde7f6"/>
  <circle cx="70" cy="463" r="15" fill="#fff" stroke="#cfcec6" stroke-width="2"/>
  <text x="70" y="469" font-size="16" fill="#555" text-anchor="middle">3</text>
  <text x="98" y="469" font-size="19" fill="#555" font-weight="600">M3</text>
  <text x="148" y="469" font-size="19" fill="#1f1f1f">w.start();</text>
  <text x="148" y="491" font-size="16" fill="#666">SND(g<tspan baseline-shift='sub' font-size='12'>s</tspan>) to W</text>
  <rect x="54" y="564" width="696" height="54" rx="6" fill="#f7dedd"/>
  <circle cx="70" cy="583" r="15" fill="#fff" stroke="#cfcec6" stroke-width="2"/>
  <text x="70" y="589" font-size="16" fill="#555" text-anchor="middle">5</text>
  <text x="98" y="589" font-size="19" fill="#555" font-weight="600">M4</text>
  <text x="148" y="589" font-size="19" fill="#1f1f1f">hits = 7;</text>
  <text x="148" y="611" font-size="16" fill="#666">MEM(hits, WRITE)</text>
  <rect x="54" y="624" width="696" height="54" rx="6" fill="#dde7f6"/>
  <circle cx="70" cy="643" r="15" fill="#fff" stroke="#cfcec6" stroke-width="2"/>
  <text x="70" y="649" font-size="16" fill="#555" text-anchor="middle">6</text>
  <text x="98" y="649" font-size="19" fill="#555" font-weight="600">M5</text>
  <text x="148" y="649" font-size="19" fill="#1f1f1f">synchronized (clockLock) { clock++; }</text>
  <text x="148" y="671" font-size="16" fill="#666">ACQ · MEM(clock, WRITE) · REL on clockLock</text>
  <rect x="790" y="114" width="600" height="704" rx="12" fill="#fff" stroke="#cfcec6" stroke-width="2"/>
  <text x="816" y="156" font-size="22" fill="#1f1f1f" font-weight="700">Worker thread (W)</text>
  <text x="816" y="188" font-size="19" fill="#555">Worker.run(): reaches the same fields through srv</text>
  <line x1="790" y1="206" x2="1390" y2="206" stroke="#cfcec6" stroke-width="1.5"/>
  <rect x="802" y="444" width="576" height="54" rx="6" fill="#dde7f6"/>
  <text x="896" y="469" font-size="19" fill="#1f1f1f" font-weight="600">W begins (started by M3)</text>
  <text x="896" y="491" font-size="16" fill="#666">RCV(g<tspan baseline-shift='sub' font-size='12'>s</tspan>)</text>
  <rect x="802" y="504" width="576" height="54" rx="6" fill="#fdf0d5"/>
  <circle cx="818" cy="523" r="15" fill="#fff" stroke="#cfcec6" stroke-width="2"/>
  <text x="818" y="529" font-size="16" fill="#555" text-anchor="middle">4</text>
  <text x="846" y="529" font-size="19" fill="#555" font-weight="600">W1</text>
  <text x="896" y="529" font-size="19" fill="#1f1f1f">int t = srv.cfg.timeout;</text>
  <text x="896" y="551" font-size="16" fill="#666">MEM(cfg, READ)</text>
  <rect x="802" y="684" width="576" height="54" rx="6" fill="#dde7f6"/>
  <circle cx="818" cy="703" r="15" fill="#fff" stroke="#cfcec6" stroke-width="2"/>
  <text x="818" y="709" font-size="16" fill="#555" text-anchor="middle">7</text>
  <text x="846" y="709" font-size="19" fill="#555" font-weight="600">W2</text>
  <text x="896" y="709" font-size="19" fill="#1f1f1f">synchronized (srv.clockLock) { srv.clock++; }</text>
  <text x="896" y="731" font-size="16" fill="#666">ACQ · MEM(clock, WRITE) · REL on clockLock</text>
  <rect x="802" y="744" width="576" height="54" rx="6" fill="#f7dedd"/>
  <circle cx="818" cy="763" r="15" fill="#fff" stroke="#cfcec6" stroke-width="2"/>
  <text x="818" y="769" font-size="16" fill="#555" text-anchor="middle">8</text>
  <text x="846" y="769" font-size="19" fill="#555" font-weight="600">W3</text>
  <text x="896" y="769" font-size="19" fill="#1f1f1f">int x = srv.hits;</text>
  <text x="896" y="791" font-size="16" fill="#666">MEM(hits, READ)</text>
  <line x1="748" y1="463" x2="800" y2="463" stroke="#2f7bd6" stroke-width="3" marker-end="url(#ah-blue)"/>
  <rect x="42" y="838" width="22" height="22" rx="4" fill="#f7dedd"/>
  <text x="78" y="854" font-size="19" fill="#1f1f1f">access in the real race (hits)</text>
  <rect x="422.0" y="838" width="22" height="22" rx="4" fill="#fdf0d5"/>
  <text x="458.0" y="854" font-size="19" fill="#1f1f1f">safe access that lockset flags (cfg)</text>
  <rect x="859.5999999999999" y="838" width="22" height="22" rx="4" fill="#dde7f6"/>
  <text x="895.5999999999999" y="854" font-size="19" fill="#1f1f1f">synchronization</text>
</svg>
