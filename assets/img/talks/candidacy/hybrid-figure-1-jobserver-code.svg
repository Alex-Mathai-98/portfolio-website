<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 510" width="1320" height="510" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <!-- AIDEV-NOTE: candidacy page only: simplified JobServer (cfg, hits, clock) for the Hybrid section. Generated by a script; labels M1-M5, W1-W3 match the post's labels for the same lines. -->
  <defs>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f7bd6"/></marker>
    <marker id="ah-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b5b4a8"/></marker>
  </defs>
  <rect width="1320" height="510" fill="#ffffff"/>
  <text x="42" y="52" font-size="26" fill="#1f1f1f" font-weight="600">JobServer: two threads, three shared fields, one real race</text>
  <text x="42" y="86" font-size="19" fill="#555">Circled numbers give the order of the observed run; labels M1 to W3 are used throughout</text>
  <rect x="42" y="114" width="580" height="332" rx="12" fill="#fff" stroke="#cfcec6" stroke-width="2"/>
  <text x="68" y="156" font-size="22" fill="#1f1f1f" font-weight="700">Main thread (M)</text>
  <text x="68" y="188" font-size="19" fill="#555">Server.serve(): owns cfg, hits, clock</text>
  <line x1="42" y1="206" x2="622" y2="206" stroke="#cfcec6" stroke-width="1.5"/>
  <rect x="54" y="220" width="556" height="36" rx="6" fill="#fdf0d5"/>
  <circle cx="70" cy="238" r="15" fill="#fff" stroke="#cfcec6" stroke-width="2"/>
  <text x="70" y="244" font-size="16" fill="#555" text-anchor="middle">1</text>
  <text x="98" y="245" font-size="19" fill="#555" font-weight="600">M1</text>
  <text x="148" y="245" font-size="19" fill="#1f1f1f">cfg = Config.load();</text>
  <rect x="54" y="260" width="556" height="36" rx="6" fill="#ffffff"/>
  <circle cx="70" cy="278" r="15" fill="#fff" stroke="#cfcec6" stroke-width="2"/>
  <text x="70" y="284" font-size="16" fill="#555" text-anchor="middle">2</text>
  <text x="98" y="285" font-size="19" fill="#555" font-weight="600">M2</text>
  <text x="148" y="285" font-size="19" fill="#1f1f1f">Worker w = new Worker(this);</text>
  <rect x="54" y="300" width="556" height="36" rx="6" fill="#dde7f6"/>
  <circle cx="70" cy="318" r="15" fill="#fff" stroke="#cfcec6" stroke-width="2"/>
  <text x="70" y="324" font-size="16" fill="#555" text-anchor="middle">3</text>
  <text x="98" y="325" font-size="19" fill="#555" font-weight="600">M3</text>
  <text x="148" y="325" font-size="19" fill="#1f1f1f">w.start();</text>
  <rect x="54" y="340" width="556" height="36" rx="6" fill="#f7dedd"/>
  <circle cx="70" cy="358" r="15" fill="#fff" stroke="#cfcec6" stroke-width="2"/>
  <text x="70" y="364" font-size="16" fill="#555" text-anchor="middle">5</text>
  <text x="98" y="365" font-size="19" fill="#555" font-weight="600">M4</text>
  <text x="148" y="365" font-size="19" fill="#1f1f1f">hits = 7;</text>
  <rect x="54" y="380" width="556" height="36" rx="6" fill="#dde7f6"/>
  <circle cx="70" cy="398" r="15" fill="#fff" stroke="#cfcec6" stroke-width="2"/>
  <text x="70" y="404" font-size="16" fill="#555" text-anchor="middle">6</text>
  <text x="98" y="405" font-size="19" fill="#555" font-weight="600">M5</text>
  <text x="148" y="405" font-size="19" fill="#1f1f1f">synchronized (clockLock) { clock++; }</text>
  <rect x="650" y="114" width="630" height="332" rx="12" fill="#fff" stroke="#cfcec6" stroke-width="2"/>
  <text x="676" y="156" font-size="22" fill="#1f1f1f" font-weight="700">Worker thread (W)</text>
  <text x="676" y="188" font-size="19" fill="#555">Worker.run(): reaches the same fields through srv</text>
  <line x1="650" y1="206" x2="1280" y2="206" stroke="#cfcec6" stroke-width="1.5"/>
  <rect x="662" y="220" width="606" height="36" rx="6" fill="#fdf0d5"/>
  <circle cx="678" cy="238" r="15" fill="#fff" stroke="#cfcec6" stroke-width="2"/>
  <text x="678" y="244" font-size="16" fill="#555" text-anchor="middle">4</text>
  <text x="706" y="245" font-size="19" fill="#555" font-weight="600">W1</text>
  <text x="756" y="245" font-size="19" fill="#1f1f1f">int t = srv.cfg.timeout;</text>
  <rect x="662" y="260" width="606" height="36" rx="6" fill="#dde7f6"/>
  <circle cx="678" cy="278" r="15" fill="#fff" stroke="#cfcec6" stroke-width="2"/>
  <text x="678" y="284" font-size="16" fill="#555" text-anchor="middle">7</text>
  <text x="706" y="285" font-size="19" fill="#555" font-weight="600">W2</text>
  <text x="756" y="285" font-size="19" fill="#1f1f1f">synchronized (srv.clockLock) { srv.clock++; }</text>
  <rect x="662" y="300" width="606" height="36" rx="6" fill="#f7dedd"/>
  <circle cx="678" cy="318" r="15" fill="#fff" stroke="#cfcec6" stroke-width="2"/>
  <text x="678" y="324" font-size="16" fill="#555" text-anchor="middle">8</text>
  <text x="706" y="325" font-size="19" fill="#555" font-weight="600">W3</text>
  <text x="756" y="325" font-size="19" fill="#1f1f1f">int x = srv.hits;</text>
  <rect x="42" y="460" width="22" height="22" rx="4" fill="#f7dedd"/>
  <text x="78" y="476" font-size="19" fill="#1f1f1f">access in the real race (hits)</text>
  <rect x="422.0" y="460" width="22" height="22" rx="4" fill="#fdf0d5"/>
  <text x="458.0" y="476" font-size="19" fill="#1f1f1f">safe access that lockset flags (cfg)</text>
  <rect x="859.5999999999999" y="460" width="22" height="22" rx="4" fill="#dde7f6"/>
  <text x="895.5999999999999" y="476" font-size="19" fill="#1f1f1f">synchronization</text>
</svg>
