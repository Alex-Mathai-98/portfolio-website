<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 600" width="1320" height="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <!-- AIDEV-NOTE: candidacy page only (Eraser). Simplest lockset false alarm: spawn/join order the two writes
       (orange happens-before path), but no lock is held, so C(result) empties and Eraser warns. -->
  <defs>
    <marker id="ah-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c8c7bc"/></marker>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1c6dd0"/></marker>
  </defs>
  <rect width="1320" height="600" fill="#ffffff"/>
  <text x="42" y="44" font-size="25" font-weight="600" fill="#1f1f1f">A false alarm: the join protects result, but lockset only looks for locks</text>
  <text x="42" y="76" font-size="19" fill="#555">Blue arrows are spawn and join. Orange is the happens-before path between the two writes.</text>
  <g font-size="22" font-weight="700" fill="#1f1f1f"><text x="42" y="208">main</text><text x="42" y="348">T1</text></g>
  <g stroke="#c8c7bc" stroke-width="2">
    <line x1="130" y1="200" x2="1260" y2="200" marker-end="url(#ah-grey)"/>
    <line x1="330" y1="340" x2="760" y2="340"/>
  </g>
  <g stroke="#d9480f" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.85">
    <line x1="520" y1="340" x2="740" y2="340"/>
    <line x1="820" y1="200" x2="1030" y2="200"/>
  </g>
  <g stroke="#1c6dd0" stroke-width="3" fill="none">
    <line x1="250" y1="200" x2="322" y2="334" marker-end="url(#ah-blue)"/>
    <line x1="745" y1="331" x2="812" y2="212" marker-end="url(#ah-blue)"/>
  </g>
  <g font-size="18" font-weight="600" fill="#1c6dd0">
    <text x="250" y="176" text-anchor="middle">spawn(T1)</text>
    <text x="820" y="176" text-anchor="middle">join(T1)</text>
    <text x="740" y="376" text-anchor="middle">T1 ends</text>
  </g>
  <circle cx="250" cy="200" r="8" fill="#1c6dd0"/><circle cx="820" cy="200" r="8" fill="#1c6dd0"/><circle cx="740" cy="340" r="8" fill="#1c6dd0"/>
  <circle cx="520" cy="340" r="10" fill="#0b7a75"/>
  <text x="520" y="376" font-size="20" font-weight="700" fill="#0b7a75" text-anchor="middle">result = 42</text>
  <text x="520" y="400" font-size="17" fill="#555" text-anchor="middle">locks held: { }</text>
  <circle cx="1030" cy="200" r="10" fill="#0b7a75"/>
  <text x="1030" y="176" font-size="20" font-weight="700" fill="#0b7a75" text-anchor="middle">result = result + 1</text>
  <text x="1030" y="150" font-size="17" fill="#555" text-anchor="middle">locks held: { }</text>
  <rect x="42" y="440" width="598" height="128" rx="12" fill="none" stroke="#d9480f" stroke-width="2.5"/>
  <text x="66" y="476" font-size="18" font-weight="700" fill="#d9480f">Happens-before: no race</text>
  <text x="66" y="503" font-size="18" fill="#1f1f1f">result = 42 → T1 ends → join → result = result + 1.</text>
  <text x="66" y="530" font-size="18" fill="#1f1f1f">The writes are ordered, so they can never overlap.</text>
  <rect x="680" y="440" width="598" height="128" rx="12" fill="#e3f2f1" stroke="#0b7a75" stroke-width="2.5"/>
  <text x="704" y="476" font-size="18" font-weight="700" fill="#0b7a75">Lockset: WARNING (false alarm)</text>
  <text x="704" y="503" font-size="18" fill="#1f1f1f">C(result) = { } ∩ { } = empty: no common lock.</text>
  <text x="704" y="530" font-size="18" fill="#1f1f1f">The join protects result, but lockset only sees locks.</text>
</svg>
