<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1380 748" width="1380" height="748" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <!-- AIDEV-NOTE: candidacy page only (LOOM, computing unsafe program locations). Illustrative, not from the paper.
       Update checks at the two safe statements have their wait flags set (matches the text under Pausing only at safe locations). -->
  <rect width="1380" height="748" fill="#ffffff"/>
  <text x="42" y="48" font-size="26" fill="#1f1f1f" font-weight="600">Which statements are unsafe for installing a mutual-exclusion filter</text>
  <text x="42" y="82" font-size="19" fill="#555">A thread paused at s is unsafe if it may have passed a region entry and may still reach a region exit.</text>
  <text x="295.0" y="148" font-size="20" fill="#1f1f1f" font-weight="600" text-anchor="middle">One thread&#x27;s path through the code</text>
  <text x="625" y="148" font-size="20" fill="#1f1f1f" font-weight="600" text-anchor="middle">Passed an entry?</text>
  <text x="815" y="148" font-size="20" fill="#1f1f1f" font-weight="600" text-anchor="middle">Can reach an exit?</text>
  <text x="985" y="148" font-size="20" fill="#1f1f1f" font-weight="600" text-anchor="middle">Verdict</text>
  <text x="1200" y="148" font-size="20" fill="#1f1f1f" font-weight="600" text-anchor="middle">Update check</text>
  <line x1="42" y1="164" x2="1340" y2="164" stroke="#b5b4a8" stroke-width="2"/>
  <line x1="295.0" y1="190" x2="295.0" y2="574" stroke="#b5b4a8" stroke-width="2"/>
  <rect x="80" y="188" width="430" height="52" rx="10" fill="#e6f4ea" stroke="#2b8a3e" stroke-width="2"/>
  <text x="100" y="221" font-size="18" fill="#1f1f1f" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">x = read_config();</text>
  <text x="625" y="222" font-size="18" fill="#888" text-anchor="middle">no</text>
  <text x="815" y="222" font-size="18" fill="#1f1f1f" font-weight="600" text-anchor="middle">yes</text>
  <text x="985" y="222" font-size="18" fill="#2b8a3e" font-weight="700" text-anchor="middle">safe</text>
  <rect x="1105" y="198" width="190" height="34" rx="17" fill="#fff8e8" stroke="#b07c12" stroke-width="2"/>
  <text x="1200" y="221" font-size="16" fill="#b07c12" font-weight="700" text-anchor="middle">yes: wait flag set</text>
  <line x1="60" y1="270" x2="1340" y2="270" stroke="#2f7bd6" stroke-width="2.5" stroke-dasharray="8 6"/>
  <rect x="100" y="256" width="390" height="28" rx="14" fill="#fff" stroke="#2f7bd6" stroke-width="2"/>
  <text x="295.0" y="276" font-size="16" fill="#2f7bd6" font-weight="700" text-anchor="middle">region entry: the new lock() goes here</text>
  <rect x="80" y="298" width="430" height="52" rx="10" fill="#f7dedd" stroke="#d1342f" stroke-width="2"/>
  <text x="100" y="331" font-size="18" fill="#1f1f1f" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">open_table(t);</text>
  <text x="625" y="332" font-size="18" fill="#1f1f1f" font-weight="600" text-anchor="middle">yes</text>
  <text x="815" y="332" font-size="18" fill="#1f1f1f" font-weight="600" text-anchor="middle">yes</text>
  <text x="985" y="332" font-size="18" fill="#d1342f" font-weight="700" text-anchor="middle">unsafe</text>
  <text x="1200" y="332" font-size="18" fill="#888" text-anchor="middle">—</text>
  <rect x="80" y="368" width="430" height="52" rx="10" fill="#f7dedd" stroke="#d1342f" stroke-width="2"/>
  <text x="100" y="401" font-size="18" fill="#1f1f1f" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">write_rows(t);</text>
  <text x="625" y="402" font-size="18" fill="#1f1f1f" font-weight="600" text-anchor="middle">yes</text>
  <text x="815" y="402" font-size="18" fill="#1f1f1f" font-weight="600" text-anchor="middle">yes</text>
  <text x="985" y="402" font-size="18" fill="#d1342f" font-weight="700" text-anchor="middle">unsafe</text>
  <text x="1200" y="402" font-size="18" fill="#888" text-anchor="middle">—</text>
  <rect x="80" y="438" width="430" height="52" rx="10" fill="#f7dedd" stroke="#d1342f" stroke-width="2"/>
  <text x="100" y="471" font-size="18" fill="#1f1f1f" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">close_table(t);</text>
  <text x="625" y="472" font-size="18" fill="#1f1f1f" font-weight="600" text-anchor="middle">yes</text>
  <text x="815" y="472" font-size="18" fill="#1f1f1f" font-weight="600" text-anchor="middle">yes</text>
  <text x="985" y="472" font-size="18" fill="#d1342f" font-weight="700" text-anchor="middle">unsafe</text>
  <text x="1200" y="472" font-size="18" fill="#888" text-anchor="middle">—</text>
  <line x1="60" y1="520" x2="1340" y2="520" stroke="#2f7bd6" stroke-width="2.5" stroke-dasharray="8 6"/>
  <rect x="100" y="506" width="390" height="28" rx="14" fill="#fff" stroke="#2f7bd6" stroke-width="2"/>
  <text x="295.0" y="526" font-size="16" fill="#2f7bd6" font-weight="700" text-anchor="middle">region exit: the new unlock() goes here</text>
  <rect x="80" y="548" width="430" height="52" rx="10" fill="#e6f4ea" stroke="#2b8a3e" stroke-width="2"/>
  <text x="100" y="581" font-size="18" fill="#1f1f1f" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">log(&quot;done&quot;);</text>
  <text x="625" y="582" font-size="18" fill="#1f1f1f" font-weight="600" text-anchor="middle">yes</text>
  <text x="815" y="582" font-size="18" fill="#888" text-anchor="middle">no</text>
  <text x="985" y="582" font-size="18" fill="#2b8a3e" font-weight="700" text-anchor="middle">safe</text>
  <rect x="1105" y="558" width="190" height="34" rx="17" fill="#fff8e8" stroke="#b07c12" stroke-width="2"/>
  <text x="1200" y="581" font-size="16" fill="#b07c12" font-weight="700" text-anchor="middle">yes: wait flag set</text>
  <rect x="42" y="626" width="1298" height="92" rx="12" fill="none" stroke="#d1342f" stroke-width="2.5"/>
  <text x="66" y="662" font-size="19" fill="#d1342f" font-weight="700">Why the red statements are unsafe</text>
  <text x="66" y="692" font-size="17" fill="#1f1f1f">A thread paused at write_rows(t) already went past the entry before lock() existed, but will still run the new unlock(): a double unlock.</text>
</svg>
