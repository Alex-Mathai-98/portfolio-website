<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1494 1732" width="1494" height="1732" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <!-- AIDEV-NOTE: generated for the candidacy page (Eraser, read/write rule from the start). Arrows run from each
       access to the C(v) box it updates: purple config_max, teal table, orange hits. Blue border = changed. -->
  <defs>
    <marker id="ah-pu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7048e8"/></marker>
    <marker id="ah-te" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0b7a75"/></marker>
    <marker id="ah-or" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker>
  </defs>
  <rect width="1494" height="1732" fill="#ffffff"/>
  <text x="42" y="52" font-size="26" fill="#1f1f1f" font-weight="600">The basic algorithm catches both bugs but raises a false alarm on config_max</text>
  <text x="42" y="86" font-size="19" fill="#555">No states yet. Line numbers as in Figure 1; under each access, the lock set it is intersected with.</text>
  <text x="42" y="150" font-size="21" fill="#1f1f1f" font-weight="600">1. After main and W1 run (cache miss, so W1 inserts)</text>
  <rect x="42" y="184" width="778" height="408" rx="12" fill="#fff" stroke="#cfcec6" stroke-width="2"/>
  <rect x="46" y="196" width="770" height="64" fill="#e3ecf7"/>
  <text x="88" y="219" font-size="19" fill="#666" text-anchor="end">8</text>
  <text x="110" y="219" font-size="20" fill="#1f1f1f">config_max = 100;</text>
  <text x="798" y="219" font-size="19" fill="#555" text-anchor="end">main</text>
  <text x="138" y="250" font-size="18" fill="#555">write config_max · write_locks_held: none</text>
  <rect x="46" y="260" width="770" height="64" fill="#e3ecf7"/>
  <text x="88" y="283" font-size="19" fill="#666" text-anchor="end">15</text>
  <text x="110" y="283" font-size="20" fill="#1f1f1f">n = config_max;</text>
  <text x="798" y="283" font-size="19" fill="#555" text-anchor="end">W1</text>
  <text x="138" y="314" font-size="18" fill="#555">read config_max · locks_held: none</text>
  <rect x="46" y="324" width="770" height="64" fill="#e3ecf7"/>
  <text x="88" y="347" font-size="19" fill="#666" text-anchor="end">16</text>
  <text x="110" y="347" font-size="20" fill="#1f1f1f">rlock(table_rw); e = lookup(table, key); runlock(table_rw);</text>
  <text x="138" y="378" font-size="18" fill="#555">read table · locks_held: table_rw</text>
  <text x="88" y="411" font-size="19" fill="#666" text-anchor="end">17</text>
  <text x="110" y="411" font-size="20" fill="#1f1f1f">if (e == NULL) {</text>
  <rect x="46" y="420" width="770" height="64" fill="#e3ecf7"/>
  <text x="88" y="443" font-size="19" fill="#666" text-anchor="end">18</text>
  <text x="138" y="443" font-size="20" fill="#1f1f1f">wlock(table_rw); insert(table, key, n); wunlock(table_rw);</text>
  <text x="166" y="474" font-size="18" fill="#555">write table · write_locks_held: table_rw</text>
  <text x="88" y="507" font-size="19" fill="#666" text-anchor="end">19</text>
  <text x="110" y="507" font-size="20" fill="#1f1f1f">}</text>
  <rect x="46" y="516" width="770" height="64" fill="#e3ecf7"/>
  <text x="88" y="539" font-size="19" fill="#666" text-anchor="end">20</text>
  <text x="110" y="539" font-size="20" fill="#1f1f1f">lock(stats_mu); hits = hits + 1; unlock(stats_mu);</text>
  <text x="138" y="570" font-size="18" fill="#555">update hits · write_locks_held: stats_mu</text>
  <rect x="998" y="184" width="454" height="116" rx="12" fill="#e3ecf7" stroke="#2f7bd6" stroke-width="3"/>
  <text x="1020" y="218" font-size="21" fill="#1f1f1f" font-weight="700">config_max</text>
  <text x="1020" y="250" font-size="20" fill="#1f1f1f">C(v): empty</text>
  <text x="1020" y="280" font-size="20" fill="#1f1f1f" font-weight="700">WARNING (false alarm)</text>
  <rect x="998" y="314" width="454" height="116" rx="12" fill="#fff" stroke="#2f7bd6" stroke-width="3"/>
  <text x="1020" y="348" font-size="21" fill="#1f1f1f" font-weight="700">table</text>
  <text x="1020" y="380" font-size="20" fill="#1f1f1f">C(v): table_rw</text>
  <text x="1020" y="410" font-size="20" fill="#666">no warning</text>
  <rect x="998" y="444" width="454" height="116" rx="12" fill="#fff" stroke="#2f7bd6" stroke-width="3"/>
  <text x="1020" y="478" font-size="21" fill="#1f1f1f" font-weight="700">hits</text>
  <text x="1020" y="510" font-size="20" fill="#1f1f1f">C(v): stats_mu</text>
  <text x="1020" y="540" font-size="20" fill="#666">no warning</text>
  <circle cx="824" cy="228" r="4" fill="#7048e8"/>
  <path d="M824,228 C894,228 912,229.0 992,229.0" fill="none" stroke="#7048e8" stroke-width="2.5" marker-end="url(#ah-pu)"/>
  <circle cx="824" cy="292" r="4" fill="#7048e8"/>
  <path d="M824,292 C894,292 912,255.0 992,255.0" fill="none" stroke="#7048e8" stroke-width="2.5" marker-end="url(#ah-pu)"/>
  <circle cx="824" cy="356" r="4" fill="#0b7a75"/>
  <path d="M824,356 C894,356 912,359.0 992,359.0" fill="none" stroke="#0b7a75" stroke-width="2.5" marker-end="url(#ah-te)"/>
  <circle cx="824" cy="452" r="4" fill="#0b7a75"/>
  <path d="M824,452 C894,452 912,385.0 992,385.0" fill="none" stroke="#0b7a75" stroke-width="2.5" marker-end="url(#ah-te)"/>
  <circle cx="824" cy="548" r="4" fill="#d9480f"/>
  <path d="M824,548 C894,548 912,502.0 992,502.0" fill="none" stroke="#d9480f" stroke-width="2.5" marker-end="url(#ah-or)"/>
  <text x="42" y="636" font-size="19" fill="#1f1f1f">No states yet, so the unlocked write by main at line 8 already empties C(config_max): a false alarm.</text>
  <text x="42" y="712" font-size="21" fill="#1f1f1f" font-weight="600">2. After W2 runs (cache hit, no insert)</text>
  <rect x="42" y="746" width="778" height="248" rx="12" fill="#fff" stroke="#cfcec6" stroke-width="2"/>
  <rect x="46" y="758" width="770" height="64" fill="#e3ecf7"/>
  <text x="88" y="781" font-size="19" fill="#666" text-anchor="end">15</text>
  <text x="110" y="781" font-size="20" fill="#1f1f1f">n = config_max;</text>
  <text x="138" y="812" font-size="18" fill="#555">read config_max · locks_held: none</text>
  <rect x="46" y="822" width="770" height="64" fill="#e3ecf7"/>
  <text x="88" y="845" font-size="19" fill="#666" text-anchor="end">16</text>
  <text x="110" y="845" font-size="20" fill="#1f1f1f">rlock(table_rw); e = lookup(table, key); runlock(table_rw);</text>
  <text x="138" y="876" font-size="18" fill="#555">read table · locks_held: table_rw</text>
  <text x="110" y="909" font-size="20" fill="#555">lines 17 to 19 skipped (cache hit)</text>
  <rect x="46" y="918" width="770" height="64" fill="#e3ecf7"/>
  <text x="88" y="941" font-size="19" fill="#666" text-anchor="end">20</text>
  <text x="110" y="941" font-size="20" fill="#1f1f1f">lock(stats_mu); hits = hits + 1; unlock(stats_mu);</text>
  <text x="138" y="972" font-size="18" fill="#555">update hits · write_locks_held: stats_mu</text>
  <rect x="998" y="746" width="454" height="116" rx="12" fill="#fff" stroke="#cfcec6" stroke-width="2"/>
  <text x="1020" y="780" font-size="21" fill="#1f1f1f" font-weight="700">config_max</text>
  <text x="1020" y="812" font-size="20" fill="#1f1f1f">C(v): empty</text>
  <text x="1020" y="842" font-size="20" fill="#666">already reported</text>
  <rect x="998" y="876" width="454" height="116" rx="12" fill="#fff" stroke="#cfcec6" stroke-width="2"/>
  <text x="1020" y="910" font-size="21" fill="#1f1f1f" font-weight="700">table</text>
  <text x="1020" y="942" font-size="20" fill="#1f1f1f">C(v): table_rw</text>
  <text x="1020" y="972" font-size="20" fill="#666">no warning</text>
  <rect x="998" y="1006" width="454" height="116" rx="12" fill="#fff" stroke="#cfcec6" stroke-width="2"/>
  <text x="1020" y="1040" font-size="21" fill="#1f1f1f" font-weight="700">hits</text>
  <text x="1020" y="1072" font-size="20" fill="#1f1f1f">C(v): stats_mu</text>
  <text x="1020" y="1102" font-size="20" fill="#666">no warning</text>
  <circle cx="824" cy="790" r="4" fill="#7048e8"/>
  <path d="M824,790 C894,790 912,804.0 992,804.0" fill="none" stroke="#7048e8" stroke-width="2.5" marker-end="url(#ah-pu)"/>
  <circle cx="824" cy="854" r="4" fill="#0b7a75"/>
  <path d="M824,854 C894,854 912,934.0 992,934.0" fill="none" stroke="#0b7a75" stroke-width="2.5" marker-end="url(#ah-te)"/>
  <circle cx="824" cy="950" r="4" fill="#d9480f"/>
  <path d="M824,950 C894,950 912,1064.0 992,1064.0" fill="none" stroke="#d9480f" stroke-width="2.5" marker-end="url(#ah-or)"/>
  <text x="42" y="1166" font-size="19" fill="#1f1f1f">W2 holds the same locks as W1 did, so no candidate set changes.</text>
  <text x="42" y="1242" font-size="21" fill="#1f1f1f" font-weight="600">3. After R runs</text>
  <rect x="42" y="1276" width="778" height="216" rx="12" fill="#fff" stroke="#cfcec6" stroke-width="2"/>
  <rect x="46" y="1288" width="770" height="64" fill="#e3ecf7"/>
  <text x="88" y="1311" font-size="19" fill="#666" text-anchor="end">24</text>
  <text x="110" y="1311" font-size="20" fill="#1f1f1f">rlock(table_rw); sz = size(table); runlock(table_rw);</text>
  <text x="138" y="1342" font-size="18" fill="#555">read table · locks_held: table_rw</text>
  <rect x="46" y="1352" width="770" height="64" fill="#e3ecf7"/>
  <text x="88" y="1375" font-size="19" fill="#666" text-anchor="end">25</text>
  <text x="110" y="1375" font-size="20" fill="#1f1f1f" font-weight="600">lock(log_mu); print(sz); hits = 0; unlock(log_mu);</text>
  <text x="138" y="1406" font-size="18" fill="#1f1f1f" font-weight="600">write hits · write_locks_held: log_mu</text>
  <rect x="46" y="1416" width="770" height="64" fill="#e3ecf7"/>
  <text x="88" y="1439" font-size="19" fill="#666" text-anchor="end">26</text>
  <text x="110" y="1439" font-size="20" fill="#1f1f1f" font-weight="600">rlock(table_rw); evict_stale(table); runlock(table_rw);</text>
  <text x="138" y="1470" font-size="18" fill="#1f1f1f" font-weight="600">write table · write_locks_held: none (table_rw is held in read mode)</text>
  <rect x="998" y="1276" width="454" height="116" rx="12" fill="#fff" stroke="#cfcec6" stroke-width="2"/>
  <text x="1020" y="1310" font-size="21" fill="#1f1f1f" font-weight="700">config_max</text>
  <text x="1020" y="1342" font-size="20" fill="#1f1f1f">C(v): empty</text>
  <text x="1020" y="1372" font-size="20" fill="#666">already reported</text>
  <rect x="998" y="1406" width="454" height="116" rx="12" fill="#e3ecf7" stroke="#2f7bd6" stroke-width="3"/>
  <text x="1020" y="1440" font-size="21" fill="#1f1f1f" font-weight="700">table</text>
  <text x="1020" y="1472" font-size="20" fill="#1f1f1f">C(v): table_rw ∩ { } = empty</text>
  <text x="1020" y="1502" font-size="20" fill="#1f1f1f" font-weight="700">WARNING (Bug 2)</text>
  <rect x="998" y="1536" width="454" height="116" rx="12" fill="#e3ecf7" stroke="#2f7bd6" stroke-width="3"/>
  <text x="1020" y="1570" font-size="21" fill="#1f1f1f" font-weight="700">hits</text>
  <text x="1020" y="1602" font-size="20" fill="#1f1f1f">C(v): stats_mu ∩ log_mu = empty</text>
  <text x="1020" y="1632" font-size="20" fill="#1f1f1f" font-weight="700">WARNING (Bug 1)</text>
  <circle cx="824" cy="1320" r="4" fill="#0b7a75"/>
  <path d="M824,1320 C894,1320 912,1451.0 992,1451.0" fill="none" stroke="#0b7a75" stroke-width="2.5" marker-end="url(#ah-te)"/>
  <circle cx="824" cy="1448" r="4" fill="#0b7a75"/>
  <path d="M824,1448 C894,1448 912,1477.0 992,1477.0" fill="none" stroke="#0b7a75" stroke-width="2.5" marker-end="url(#ah-te)"/>
  <circle cx="824" cy="1384" r="4" fill="#d9480f"/>
  <path d="M824,1384 C894,1384 912,1594.0 992,1594.0" fill="none" stroke="#d9480f" stroke-width="2.5" marker-end="url(#ah-or)"/>
  <text x="42" y="1696" font-size="19" fill="#1f1f1f">Line 25 empties C(hits): Bug 1. Line 26 writes table with table_rw held only in read mode: Bug 2.</text>
</svg>
