<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 790" width="1320" height="790" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <!-- AIDEV-NOTE: candidacy page only; redraws the post's figure-2-vector-clocks.png on the same lane order and
       coordinates as lamport-figure-1-causality.svg. Vectors are (P, Q, R). Orange = ordered pair p1 -> r2,
       purple/teal lassos = concurrent pairs. Lassos are polylines drawn twice (wide colour, narrower tint);
       the p3-r2 lasso bends via (1040,250) because q4 sits on the straight p3-r2 line. r2 is in both a lasso
       (teal fill) and the ordered pair (orange ring). -->
  <defs>
    <marker id="ah-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c8c7bc"/></marker>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1c6dd0"/></marker>
  </defs>
  <rect width="1320" height="790" fill="#ffffff"/>
  <text x="42" y="44" font-size="25" font-weight="600" fill="#1f1f1f">Vector clocks tell ordered pairs from concurrent ones, where Lamport's numbers cannot</text>
  <text x="42" y="76" font-size="19" fill="#555">The running example with a vector clock at each event, written (P, Q, R). Each loop holds one concurrent pair.</text>
  <polyline points="460,494 884,336" fill="none" stroke="#7048e8" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="460,494 884,336" fill="none" stroke="#efe9fd" stroke-width="39" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="672,177 1040,250 1097,494" fill="none" stroke="#0b7a75" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="672,177 1040,250 1097,494" fill="none" stroke="#e3f2f1" stroke-width="39" stroke-linecap="round" stroke-linejoin="round"/>
  <g font-size="24" font-weight="700" fill="#1f1f1f">
    <text x="72" y="186">P</text><text x="72" y="345">Q</text><text x="72" y="503">R</text>
  </g>
  <g stroke="#c8c7bc" stroke-width="2" fill="none">
    <line x1="160" y1="177" x2="1245" y2="177" marker-end="url(#ah-grey)"/>
    <line x1="160" y1="336" x2="1245" y2="336" marker-end="url(#ah-grey)"/>
    <line x1="160" y1="494" x2="1245" y2="494" marker-end="url(#ah-grey)"/>
  </g>
  <text x="1245" y="110" font-size="18" fill="#555" text-anchor="end">time →</text>
  <g stroke="#1c6dd0" stroke-width="3" fill="none">
    <line x1="406" y1="177" x2="591" y2="328" marker-end="url(#ah-blue)"/>
    <line x1="460" y1="494" x2="979" y2="184" marker-end="url(#ah-blue)"/>
    <line x1="884" y1="336" x2="1084" y2="485" marker-end="url(#ah-blue)"/>
  </g>
  <g font-size="17" font-weight="600" fill="#1c6dd0">
    <text x="503" y="236">m1</text><text x="752" y="282">m3</text><text x="1000" y="400">m2</text>
  </g>
  <circle cx="248" cy="177" r="10" fill="#d9480f"/>
  <circle cx="406" cy="177" r="8" fill="#c8c7bc"/>
  <circle cx="672" cy="177" r="10" fill="#0b7a75"/>
  <circle cx="990" cy="177" r="8" fill="#c8c7bc"/>
  <circle cx="230" cy="336" r="8" fill="#c8c7bc"/>
  <circle cx="460" cy="336" r="8" fill="#c8c7bc"/>
  <circle cx="601" cy="336" r="8" fill="#c8c7bc"/>
  <circle cx="884" cy="336" r="10" fill="#7048e8"/>
  <circle cx="460" cy="494" r="10" fill="#7048e8"/>
  <circle cx="1097" cy="494" r="10" fill="#0b7a75"/>
  <circle cx="1097" cy="494" r="15" fill="none" stroke="#d9480f" stroke-width="3"/>
  <g text-anchor="middle">
    <text x="248" y="128" font-size="20" font-weight="700" fill="#d9480f">p1</text><text x="248" y="151" font-size="17" fill="#555">(1, 0, 0)</text>
    <text x="406" y="128" font-size="20" font-weight="700" fill="#1f1f1f">p2</text><text x="406" y="151" font-size="17" fill="#555">(2, 0, 0)</text>
    <text x="672" y="120" font-size="20" font-weight="700" fill="#0b7a75">p3</text><text x="672" y="143" font-size="17" fill="#555">(3, 0, 0)</text>
    <text x="990" y="128" font-size="20" font-weight="700" fill="#1f1f1f">p4</text><text x="990" y="151" font-size="17" fill="#555">(4, 0, 1)</text>
    <text x="230" y="374" font-size="20" font-weight="700" fill="#1f1f1f">q1</text><text x="230" y="396" font-size="17" fill="#555">(0, 1, 0)</text>
    <text x="460" y="374" font-size="20" font-weight="700" fill="#1f1f1f">q2</text><text x="460" y="396" font-size="17" fill="#555">(0, 2, 0)</text>
    <text x="578" y="374" font-size="20" font-weight="700" fill="#1f1f1f">q3</text><text x="578" y="396" font-size="17" fill="#555">(2, 3, 0)</text>
    <text x="884" y="279" font-size="20" font-weight="700" fill="#7048e8">q4</text><text x="884" y="302" font-size="17" fill="#555">(2, 4, 0)</text>
    <text x="460" y="540" font-size="20" font-weight="700" fill="#7048e8">r1</text><text x="460" y="562" font-size="17" fill="#555">(0, 0, 1)</text>
    <text x="1097" y="540" font-size="20" font-weight="700" fill="#0b7a75">r2</text><text x="1097" y="562" font-size="17" fill="#555">(2, 4, 2)</text>
  </g>
  <rect x="42" y="600" width="400" height="160" rx="12" fill="none" stroke="#d9480f" stroke-width="2.5"/>
  <text x="64" y="634" font-size="17" font-weight="700" fill="#d9480f">p1 → r2: ordered</text>
  <text x="64" y="660" font-size="17" fill="#1f1f1f">(1, 0, 0) ≤ (2, 4, 2) in every entry.</text>
  <text x="64" y="686" font-size="17" fill="#1f1f1f">The chain is p1 → p2 → q3 → q4 → r2.</text>
  <text x="64" y="712" font-size="17" fill="#777">Lamport gives 1 &lt; 5, which agrees.</text>
  <rect x="460" y="600" width="400" height="160" rx="12" fill="none" stroke="#7048e8" stroke-width="2.5"/>
  <text x="482" y="634" font-size="17" font-weight="700" fill="#7048e8">r1 and q4: concurrent</text>
  <text x="482" y="660" font-size="17" fill="#1f1f1f">(0, 0, 1) vs (2, 4, 0):</text>
  <text x="482" y="686" font-size="17" fill="#1f1f1f">each is larger somewhere.</text>
  <text x="482" y="712" font-size="17" fill="#777">Lamport gives 1 &lt; 4, which looks</text>
  <text x="482" y="738" font-size="17" fill="#777">like an order.</text>
  <rect x="878" y="600" width="400" height="160" rx="12" fill="none" stroke="#0b7a75" stroke-width="2.5"/>
  <text x="900" y="634" font-size="17" font-weight="700" fill="#0b7a75">p3 and r2: concurrent</text>
  <text x="900" y="660" font-size="17" fill="#1f1f1f">(3, 0, 0) vs (2, 4, 2): p3 is larger</text>
  <text x="900" y="686" font-size="17" fill="#1f1f1f">in P, r2 in Q and R.</text>
  <text x="900" y="712" font-size="17" fill="#777">Lamport gives 3 &lt; 5, which looks</text>
  <text x="900" y="738" font-size="17" fill="#777">like an order.</text>
</svg>
