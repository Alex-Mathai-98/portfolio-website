<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 580" width="1320" height="580" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <!-- AIDEV-NOTE: candidacy page only; generated layout matches lamport-figure-1-causality.svg. Each lasso is a
       polyline drawn twice (wide coloured stroke, then a narrower tint) so it sits under lines and dots. -->
  <defs>
    <marker id="ah-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c8c7bc"/></marker>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1c6dd0"/></marker>
  </defs>
  <rect width="1320" height="580" fill="#ffffff"/>
  <text x="42" y="44" font-size="25" font-weight="600" fill="#1f1f1f">Equal timestamps mean concurrent: each loop groups one timestamp</text>
  <text x="42" y="76" font-size="19" fill="#555">Every pair inside a loop is concurrent, 6 pairs in all. Concurrent pairs with different timestamps are missed.</text>
  <!-- lassos -->
  <polyline points="248,177 230,336 460,494" fill="none" stroke="#7048e8" stroke-width="60" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="248,177 230,336 460,494" fill="none" stroke="#efe9fd" stroke-width="55" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="406,177 460,336" fill="none" stroke="#0b7a75" stroke-width="60" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="406,177 460,336" fill="none" stroke="#e3f2f1" stroke-width="55" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="672,177 601,336" fill="none" stroke="#d9480f" stroke-width="60" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="672,177 601,336" fill="none" stroke="#fcebe3" stroke-width="55" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="990,177 884,336" fill="none" stroke="#c2255c" stroke-width="60" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="990,177 884,336" fill="none" stroke="#fbe7ee" stroke-width="55" stroke-linecap="round" stroke-linejoin="round"/>
  <g font-size="24" font-weight="700" fill="#1f1f1f">
    <text x="72" y="186">P</text><text x="72" y="345">Q</text><text x="72" y="503">R</text>
  </g>
  <g stroke="#c8c7bc" stroke-width="2" fill="none">
    <line x1="160" y1="177" x2="1245" y2="177" marker-end="url(#ah-grey)"/>
    <line x1="160" y1="336" x2="1245" y2="336" marker-end="url(#ah-grey)"/>
    <line x1="160" y1="494" x2="1245" y2="494" marker-end="url(#ah-grey)"/>
  </g>
  <g stroke="#1c6dd0" stroke-width="3" fill="none">
    <line x1="406" y1="177" x2="591" y2="328" marker-end="url(#ah-blue)"/>
    <line x1="460" y1="494" x2="979" y2="184" marker-end="url(#ah-blue)"/>
    <line x1="884" y1="336" x2="1084" y2="485" marker-end="url(#ah-blue)"/>
  </g>
  <text x="1245" y="110" font-size="18" fill="#555" text-anchor="end">time →</text>
  <g font-size="17" font-weight="600" fill="#1c6dd0">
    <text x="503" y="236">m1, T=2</text><text x="730" y="226">m3, T=1</text><text x="1000" y="400">m2, T=4</text>
  </g>
  <!-- missed pair -->
  <line x1="476" y1="488" x2="868" y2="342" stroke="#8a8a80" stroke-width="2.5" stroke-dasharray="4 7"/>
  <text x="540" y="540" font-size="17" font-style="italic" fill="#6b6a60">dotted: r1 and q4 are concurrent, but missed (1 ≠ 4)</text>
  <g>
    <circle cx="248" cy="177" r="8" fill="#7048e8"/>
    <circle cx="406" cy="177" r="8" fill="#0b7a75"/>
    <circle cx="672" cy="177" r="8" fill="#d9480f"/>
    <circle cx="990" cy="177" r="8" fill="#c2255c"/>
    <circle cx="230" cy="336" r="8" fill="#7048e8"/>
    <circle cx="460" cy="336" r="8" fill="#0b7a75"/>
    <circle cx="601" cy="336" r="8" fill="#d9480f"/>
    <circle cx="884" cy="336" r="8" fill="#c2255c"/>
    <circle cx="460" cy="494" r="8" fill="#7048e8"/>
    <circle cx="1097" cy="494" r="8" fill="#c8c7bc"/>
  </g>
  <g font-size="20" fill="#1f1f1f" text-anchor="middle">
    <text x="248" y="141">p1 · 1</text>
    <text x="406" y="141">p2 · 2</text>
    <text x="672" y="141">p3 · 3</text>
    <text x="990" y="141">p4 · 4</text>
    <text x="172" y="378">q1 · 1</text>
    <text x="460" y="388">q2 · 2</text>
    <text x="601" y="388">q3 · 3</text>
    <text x="884" y="388">q4 · 4</text>
    <text x="460" y="546">r1 · 1</text>
    <text x="1097" y="533">r2 · 5</text>
  </g>
  <g font-size="17" font-weight="700">
    <text x="248" y="110" text-anchor="middle" fill="#7048e8">C = 1</text>
    <text x="406" y="110" text-anchor="middle" fill="#0b7a75">C = 2</text>
    <text x="672" y="110" text-anchor="middle" fill="#d9480f">C = 3</text>
    <text x="990" y="110" text-anchor="middle" fill="#c2255c">C = 4</text>
  </g>
</svg>
