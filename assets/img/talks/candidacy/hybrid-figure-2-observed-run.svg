<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 990" width="1340" height="990" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <!-- AIDEV-NOTE: candidacy page only: observed run of the simplified JobServer (Hybrid section Figure 2). Generated by a script. -->
  <defs>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f7bd6"/></marker>
    <marker id="ah-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b5b4a8"/></marker>
  </defs>
  <rect width="1340" height="990" fill="#ffffff"/>
  <text x="42" y="48" font-size="26" fill="#1f1f1f" font-weight="600">The observed run: M starts W, then they interleave</text>
  <text x="42" y="82" font-size="19" fill="#555">Time runs down. Each box is one step; its second line lists the events it emits (the thread is the lane).</text>
  <text x="406" y="150" font-size="22" fill="#1f1f1f" font-weight="600" text-anchor="middle">Main thread (M)</text>
  <text x="1015" y="150" font-size="22" fill="#1f1f1f" font-weight="600" text-anchor="middle">Worker thread (W)</text>
  <circle cx="64" cy="222" r="15" fill="#fff" stroke="#cfcec6" stroke-width="2"/>
  <text x="64" y="228" font-size="16" fill="#555" text-anchor="middle">1</text>
  <rect x="114" y="184" width="586" height="76" rx="10" fill="#fdf0d5" stroke="#cfcec6" stroke-width="2"/>
  <text x="136" y="216" font-size="22" fill="#1f1f1f" font-weight="600">M1 · cfg = Config.load()</text>
  <text x="136" y="246" font-size="19" fill="#555">MEM(cfg, WRITE)</text>
  <circle cx="64" cy="314" r="15" fill="#fff" stroke="#cfcec6" stroke-width="2"/>
  <text x="64" y="320" font-size="16" fill="#555" text-anchor="middle">2</text>
  <rect x="114" y="276" width="586" height="76" rx="10" fill="#ffffff" stroke="#cfcec6" stroke-width="2"/>
  <text x="136" y="308" font-size="22" fill="#1f1f1f" font-weight="600">M2 · w = new Worker(this)</text>
  <text x="136" y="338" font-size="19" fill="#555">creates W (no shared field)</text>
  <circle cx="64" cy="406" r="15" fill="#fff" stroke="#cfcec6" stroke-width="2"/>
  <text x="64" y="412" font-size="16" fill="#555" text-anchor="middle">3</text>
  <rect x="114" y="368" width="586" height="76" rx="10" fill="#dde7f6" stroke="#cfcec6" stroke-width="2"/>
  <text x="136" y="400" font-size="22" fill="#1f1f1f" font-weight="600">M3 · w.start()</text>
  <text x="136" y="430" font-size="19" fill="#555">SND(g<tspan baseline-shift='sub' font-size='13'>s</tspan>) to W</text>
  <rect x="730" y="368" width="586" height="76" rx="10" fill="#dde7f6" stroke="#cfcec6" stroke-width="2"/>
  <text x="752" y="400" font-size="22" fill="#1f1f1f" font-weight="600">W begins (started by M3)</text>
  <text x="752" y="430" font-size="19" fill="#555">RCV(g<tspan baseline-shift='sub' font-size='13'>s</tspan>)</text>
  <line x1="703" y1="406" x2="724" y2="406" stroke="#2f7bd6" stroke-width="3" marker-end="url(#ah-blue)"/>
  <circle cx="64" cy="498" r="15" fill="#fff" stroke="#cfcec6" stroke-width="2"/>
  <text x="64" y="504" font-size="16" fill="#555" text-anchor="middle">4</text>
  <rect x="730" y="460" width="586" height="76" rx="10" fill="#fdf0d5" stroke="#cfcec6" stroke-width="2"/>
  <text x="752" y="492" font-size="22" fill="#1f1f1f" font-weight="600">W1 · read srv.cfg</text>
  <text x="752" y="522" font-size="19" fill="#555">MEM(cfg, READ)</text>
  <circle cx="64" cy="590" r="15" fill="#fff" stroke="#cfcec6" stroke-width="2"/>
  <text x="64" y="596" font-size="16" fill="#555" text-anchor="middle">5</text>
  <rect x="114" y="552" width="586" height="76" rx="10" fill="#fff" stroke="#d1342f" stroke-width="3"/>
  <text x="136" y="584" font-size="22" fill="#1f1f1f" font-weight="600">M4 · hits = 7</text>
  <text x="136" y="614" font-size="19" fill="#555">MEM(hits, WRITE)</text>
  <circle cx="64" cy="682" r="15" fill="#fff" stroke="#cfcec6" stroke-width="2"/>
  <text x="64" y="688" font-size="16" fill="#555" text-anchor="middle">6</text>
  <rect x="114" y="644" width="586" height="76" rx="10" fill="#dde7f6" stroke="#cfcec6" stroke-width="2"/>
  <text x="136" y="676" font-size="22" fill="#1f1f1f" font-weight="600">M5 · clock++ inside clockLock</text>
  <text x="136" y="706" font-size="19" fill="#555">ACQ · MEM(clock, WRITE) · REL on clockLock</text>
  <circle cx="64" cy="774" r="15" fill="#fff" stroke="#cfcec6" stroke-width="2"/>
  <text x="64" y="780" font-size="16" fill="#555" text-anchor="middle">7</text>
  <rect x="730" y="736" width="586" height="76" rx="10" fill="#dde7f6" stroke="#cfcec6" stroke-width="2"/>
  <text x="752" y="768" font-size="22" fill="#1f1f1f" font-weight="600">W2 · srv.clock++ inside clockLock</text>
  <text x="752" y="798" font-size="19" fill="#555">ACQ · MEM(clock, WRITE) · REL on clockLock</text>
  <circle cx="64" cy="866" r="15" fill="#fff" stroke="#cfcec6" stroke-width="2"/>
  <text x="64" y="872" font-size="16" fill="#555" text-anchor="middle">8</text>
  <rect x="730" y="828" width="586" height="76" rx="10" fill="#fff" stroke="#d1342f" stroke-width="3"/>
  <text x="752" y="860" font-size="22" fill="#1f1f1f" font-weight="600">W3 · read srv.hits</text>
  <text x="752" y="890" font-size="19" fill="#555">MEM(hits, READ)</text>
  <rect x="42" y="944" width="22" height="22" rx="4" fill="#dde7f6"/>
  <text x="78" y="960" font-size="19" fill="#1f1f1f">synchronization</text>
  <rect x="278.0" y="944" width="22" height="22" rx="4" fill="#fdf0d5"/>
  <text x="314.0" y="960" font-size="19" fill="#1f1f1f">safe access that lockset flags (cfg)</text>
  <rect x="715.5999999999999" y="944" width="22" height="22" rx="4" fill="#fff" stroke="#d1342f" stroke-width="2.5"/>
  <text x="751.5999999999999" y="960" font-size="19" fill="#1f1f1f">access in the real race (hits)</text>
</svg>
