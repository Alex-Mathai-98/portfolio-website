<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1044" width="1240" height="1044" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <!-- AIDEV-NOTE: candidacy page only: simplified JobServer space-time diagram, vertical (Hybrid section Figure 2). Generated by a script; rows follow the observed-run step numbers of Figure 1. -->
