    <marker id="ah-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8f8e84"/></marker>
  </defs>
  <rect width="1240" height="1044" fill="#ffffff"/>
  <text x="42" y="48" font-size="26" fill="#1f1f1f" font-weight="600">A lock hand-off orders the hits race in this run</text>
