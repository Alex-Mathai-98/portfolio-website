<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-label="Timestamps rise along every causal path; r2 jumps from 1 to 5" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="st-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9AA0AA"/></marker>
  </defs>
  <rect width="760" height="330" fill="#FFFFFF"/>
  <text x="24" y="30" font-size="15" font-weight="600" fill="#1B2130">Timestamps rise along every causal path; r2 jumps from 1 to 5</text>
  <text x="24" y="50" font-size="11.5" fill="#5A6375">Dots are events (name · timestamp); slanted arrows are messages; time runs left to right</text>
  <g stroke="#9AA0AA" stroke-width="1.25">
    <line x1="90" y1="100" x2="705" y2="100" marker-end="url(#st-arrow)"/>
    <line x1="90" y1="190" x2="705" y2="190" marker-end="url(#st-arrow)"/>
    <line x1="90" y1="280" x2="705" y2="280" marker-end="url(#st-arrow)"/>
  </g>
  <g font-size="15" font-weight="600" fill="#1B2130">
    <text x="40" y="105">P</text><text x="40" y="195">Q</text><text x="40" y="285">R</text>
  </g>
  <text x="705" y="84" text-anchor="end" font-size="11.5" fill="#5A6375">time →</text>
  <g fill="none" stroke="#9AA0AA" stroke-width="1.25">
    <path d="M234.6 103.8L334.6 185.6" marker-end="url(#st-arrow)"/>
    <path d="M265.1 276.9L554 103.6" marker-end="url(#st-arrow)"/>
    <path d="M504.8 193.6L614.4 275.8" marker-end="url(#st-arrow)"/>
  </g>
  <g font-size="11.5" fill="#5A6375" text-anchor="end">
    <text x="272" y="152">m1, T=2</text><text x="452" y="128">m3, T=1</text><text x="548" y="252">m2, T=4</text>
  </g>
  <g fill="#9AA0AA">
    <circle cx="140" cy="100" r="5"/><circle cx="230" cy="100" r="5"/><circle cx="380" cy="100" r="5"/><circle cx="560" cy="100" r="5"/>
    <circle cx="130" cy="190" r="5"/><circle cx="260" cy="190" r="5"/><circle cx="340" cy="190" r="5"/><circle cx="500" cy="190" r="5"/>
    <circle cx="260" cy="280" r="5"/>
  </g>
  <circle cx="620" cy="280" r="6" fill="#3155C6"/>
  <g fill="#1B2130" text-anchor="middle">
    <text x="140" y="86">p1 · 1</text><text x="230" y="86">p2 · 2</text><text x="380" y="86">p3 · 3</text><text x="560" y="86">p4 · 4</text>
    <text x="130" y="212">q1 · 1</text><text x="260" y="212">q2 · 2</text><text x="336" y="212">q3 · 3</text><text x="500" y="176">q4 · 4</text>
    <text x="260" y="302">r1 · 1</text><text x="620" y="302" font-weight="600">r2 · 5 (jumped from 1)</text>
  </g>
</svg>
