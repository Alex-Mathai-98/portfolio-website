<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 158" width="760" role="img" aria-label="count++ is three separate machine steps, and a thread can be paused between any two" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5"><rect width="760" height="158" fill="#ffffff"/><text x="24" y="28" font-size="15" fill="#1f2328" font-weight="600">count++ is three separate machine steps, and a thread can be paused between any two</text><rect x="56" y="48" width="664" height="86" rx="8" fill="none" stroke="#c9c3b6" stroke-width="1.25"/><text x="32" y="72" font-size="11.5" fill="#5b6470" text-anchor="middle">1</text><text x="72" y="72" font-size="12" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">r = count;</text><text x="220" y="72" font-size="12" fill="#5b6470" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">// load: copy count from memory into register r</text><text x="32" y="94" font-size="11.5" fill="#5b6470" text-anchor="middle">2</text><text x="72" y="94" font-size="12" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">r = r + 1;</text><text x="220" y="94" font-size="12" fill="#5b6470" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">// add: compute the new value in the register</text><text x="32" y="116" font-size="11.5" fill="#5b6470" text-anchor="middle">3</text><text x="72" y="116" font-size="12" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">count = r;</text><text x="220" y="116" font-size="12" fill="#5b6470" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">// store: write r back to count in memory</text></svg>