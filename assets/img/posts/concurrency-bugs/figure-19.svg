<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 180" width="760" role="img" aria-label="The fix checks that the three fields agree before using them" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5"><rect width="760" height="180" fill="#ffffff"/><text x="24" y="28" font-size="15" fill="#1f2328" font-weight="600">The fix checks that the three fields agree before using them</text><rect x="56" y="79" width="664" height="22" fill="#2a78d6" fill-opacity="0.12"/><rect x="56" y="48" width="664" height="108" rx="8" fill="none" stroke="#c9c3b6" stroke-width="1.25"/><text x="32" y="72" font-size="11.5" fill="#5b6470" text-anchor="middle">1</text><text x="72" y="72" font-size="12" fill="#5b6470" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">// Thread 1: paint, after the fix</text><text x="32" y="94" font-size="11.5" fill="#5b6470" text-anchor="middle">2</text><text x="72" y="94" font-size="12" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">if (strlen(mContent) &gt;= mOffset + mLength)</text><text x="460" y="94" font-size="12" fill="#5b6470" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">// do the fields agree?</text><text x="32" y="116" font-size="11.5" fill="#5b6470" text-anchor="middle">3</text><text x="96" y="116" font-size="12" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">putc(mContent[mOffset + mLength - 1]);</text><text x="460" y="116" font-size="12" fill="#5b6470" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">// yes: safe to paint</text><text x="32" y="138" font-size="11.5" fill="#5b6470" text-anchor="middle">4</text><text x="72" y="138" font-size="12" fill="#5b6470" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">// no: skip this paint; a later repaint sees fixed values</text></svg>