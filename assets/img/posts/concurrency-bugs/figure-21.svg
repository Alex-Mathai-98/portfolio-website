<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 202" width="760" role="img" aria-label="The fix re-checks block-&gt;n and redoes the work if it changed" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5"><rect width="760" height="202" fill="#ffffff"/><text x="24" y="28" font-size="15" fill="#1f2328" font-weight="600">The fix re-checks block-&gt;n and redoes the work if it changed</text><rect x="56" y="123" width="664" height="22" fill="#2a78d6" fill-opacity="0.12"/><rect x="56" y="145" width="664" height="22" fill="#2a78d6" fill-opacity="0.12"/><rect x="56" y="48" width="664" height="130" rx="8" fill="none" stroke="#c9c3b6" stroke-width="1.25"/><text x="32" y="72" font-size="11.5" fill="#5b6470" text-anchor="middle">1</text><text x="72" y="72" font-size="12" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">retry:</text><text x="32" y="94" font-size="11.5" fill="#5b6470" text-anchor="middle">2</text><text x="96" y="94" font-size="12" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">n = block-&gt;n;</text><text x="360" y="94" font-size="12" fill="#5b6470" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">// read shared value into local</text><text x="32" y="116" font-size="11.5" fill="#5b6470" text-anchor="middle">3</text><text x="96" y="116" font-size="12" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">... do work using n ...</text><text x="32" y="138" font-size="11.5" fill="#5b6470" text-anchor="middle">4</text><text x="96" y="138" font-size="12" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">if (n != block-&gt;n)</text><text x="360" y="138" font-size="12" fill="#5b6470" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">// did someone change it meanwhile?</text><text x="32" y="160" font-size="11.5" fill="#5b6470" text-anchor="middle">5</text><text x="120" y="160" font-size="12" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">goto retry;</text><text x="360" y="160" font-size="12" fill="#5b6470" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">// yes: redo the work</text></svg>