<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 508" width="760" role="img" aria-label="A reentrant lock lets its owner lock again; only the outermost unlock releases it" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5"><rect width="760" height="508" fill="#ffffff"/><text x="24" y="28" font-size="15" fill="#1f2328" font-weight="600">A reentrant lock lets its owner lock again; only the outermost unlock releases it</text><text x="56" y="52" font-size="12" fill="#5b6470">Call sequence (thread T1): outer() -&gt; inner() -&gt; helper()</text><text x="56" y="70" font-size="12" fill="#5b6470">m is a reentrant (recursive) lock</text><rect x="56" y="231" width="664" height="20" fill="#2a78d6" fill-opacity="0.12"/><rect x="56" y="371" width="664" height="20" fill="#2a78d6" fill-opacity="0.12"/><rect x="56" y="151" width="664" height="20" fill="#2a78d6" fill-opacity="0.22"/><rect x="56" y="84" width="664" height="400" rx="8" fill="none" stroke="#c9c3b6" stroke-width="1.25"/><text x="32" y="106" font-size="11.5" fill="#5b6470" text-anchor="middle">1</text><text x="72" y="106" font-size="12" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">void outer() {</text><text x="32" y="126" font-size="11.5" fill="#5b6470" text-anchor="middle">2</text><text x="96" y="126" font-size="12" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">lock(m);</text><text x="290" y="126" font-size="12" fill="#5b6470" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">// free -&gt; owner = T1, count = 1</text><text x="32" y="146" font-size="11.5" fill="#5b6470" text-anchor="middle">3</text><text x="96" y="146" font-size="12" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">inner();</text><text x="32" y="166" font-size="11.5" fill="#5b6470" text-anchor="middle">4</text><text x="96" y="166" font-size="12" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">unlock(m);</text><text x="290" y="166" font-size="12" fill="#5b6470" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">// count = 0 -&gt; released</text><text x="32" y="186" font-size="11.5" fill="#5b6470" text-anchor="middle">5</text><text x="72" y="186" font-size="12" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">}</text><text x="32" y="206" font-size="11.5" fill="#5b6470" text-anchor="middle">6</text><text x="32" y="226" font-size="11.5" fill="#5b6470" text-anchor="middle">7</text><text x="72" y="226" font-size="12" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">void inner() {</text><text x="32" y="246" font-size="11.5" fill="#5b6470" text-anchor="middle">8</text><text x="96" y="246" font-size="12" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">lock(m);</text><text x="290" y="246" font-size="12" fill="#5b6470" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">// owner is T1 -&gt; no wait, count = 2</text><text x="32" y="266" font-size="11.5" fill="#5b6470" text-anchor="middle">9</text><text x="290" y="266" font-size="12" fill="#5b6470" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">// (non-reentrant lock would SELF-DEADLOCK here)</text><text x="32" y="286" font-size="11.5" fill="#5b6470" text-anchor="middle">10</text><text x="96" y="286" font-size="12" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">helper();</text><text x="32" y="306" font-size="11.5" fill="#5b6470" text-anchor="middle">11</text><text x="96" y="306" font-size="12" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">unlock(m);</text><text x="290" y="306" font-size="12" fill="#5b6470" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">// count = 1 -&gt; still held by T1</text><text x="32" y="326" font-size="11.5" fill="#5b6470" text-anchor="middle">12</text><text x="72" y="326" font-size="12" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">}</text><text x="32" y="346" font-size="11.5" fill="#5b6470" text-anchor="middle">13</text><text x="32" y="366" font-size="11.5" fill="#5b6470" text-anchor="middle">14</text><text x="72" y="366" font-size="12" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">void helper() {</text><text x="32" y="386" font-size="11.5" fill="#5b6470" text-anchor="middle">15</text><text x="96" y="386" font-size="12" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">lock(m);</text><text x="290" y="386" font-size="12" fill="#5b6470" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">// owner is T1 -&gt; no wait, count = 3</text><text x="32" y="406" font-size="11.5" fill="#5b6470" text-anchor="middle">16</text><text x="290" y="406" font-size="12" fill="#5b6470" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">// (non-reentrant lock would SELF-DEADLOCK here too)</text><text x="32" y="426" font-size="11.5" fill="#5b6470" text-anchor="middle">17</text><text x="96" y="426" font-size="12" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">...</text><text x="32" y="446" font-size="11.5" fill="#5b6470" text-anchor="middle">18</text><text x="96" y="446" font-size="12" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">unlock(m);</text><text x="290" y="446" font-size="12" fill="#5b6470" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">// count = 2 -&gt; still held by T1</text><text x="32" y="466" font-size="11.5" fill="#5b6470" text-anchor="middle">19</text><text x="72" y="466" font-size="12" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">}</text></svg>