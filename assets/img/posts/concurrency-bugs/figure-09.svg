<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 228" width="760" role="img" aria-label="Thread 2 reads worker before Thread 1 has assigned it" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5"><rect width="760" height="228" fill="#ffffff"/><text x="24" y="28" font-size="15" fill="#1f2328" font-weight="600">Thread 2 reads worker before Thread 1 has assigned it</text><rect x="56" y="153" width="324" height="22" fill="#2a78d6" fill-opacity="0.12"/><rect x="396" y="131" width="324" height="22" fill="#e8a33d" fill-opacity="0.22"/><rect x="56" y="48" width="324" height="156" rx="8" fill="none" stroke="#c9c3b6" stroke-width="1.25"/><line x1="56" x2="380" y1="80" y2="80" stroke="#c9c3b6"/><text x="72" y="70" font-size="12.5" fill="#1f2328" font-weight="600">Thread 1</text><rect x="396" y="48" width="324" height="156" rx="8" fill="none" stroke="#c9c3b6" stroke-width="1.25"/><line x1="396" x2="720" y1="80" y2="80" stroke="#c9c3b6"/><text x="412" y="70" font-size="12.5" fill="#1f2328" font-weight="600">Thread 2 (created by Thread 1)</text><text x="72" y="102" font-size="12" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">create_thread(run); // starts T2</text><text x="412" y="124" font-size="12" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">void run() {</text><text x="428" y="146" font-size="12" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">use(worker); // not assigned yet!</text><text x="72" y="168" font-size="12" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">worker = result; // too late</text><text x="72" y="190" font-size="12" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">worker_ready = 1;</text><text x="32" y="70" font-size="11.5" fill="#5b6470" text-anchor="middle">step</text><text x="32" y="102" font-size="11.5" fill="#5b6470" text-anchor="middle">1</text><text x="32" y="124" font-size="11.5" fill="#5b6470" text-anchor="middle">2</text><text x="32" y="146" font-size="11.5" fill="#5b6470" text-anchor="middle">3</text><text x="32" y="168" font-size="11.5" fill="#5b6470" text-anchor="middle">4</text><text x="32" y="190" font-size="11.5" fill="#5b6470" text-anchor="middle">5</text></svg>