<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 316" width="760" role="img" aria-label="Every access is locked, yet Thread 2 slips in between the check and the use" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5"><rect width="760" height="316" fill="#ffffff"/><text x="24" y="28" font-size="15" fill="#1f2328" font-weight="600">Every access is locked, yet Thread 2 slips in between the check and the use</text><rect x="396" y="153" width="324" height="66" fill="#2a78d6" fill-opacity="0.12"/><rect x="56" y="241" width="324" height="22" fill="#e8a33d" fill-opacity="0.22"/><rect x="56" y="48" width="324" height="244" rx="8" fill="none" stroke="#c9c3b6" stroke-width="1.25"/><line x1="56" x2="380" y1="80" y2="80" stroke="#c9c3b6"/><text x="72" y="70" font-size="12.5" fill="#1f2328" font-weight="600">Thread 1</text><rect x="396" y="48" width="324" height="244" rx="8" fill="none" stroke="#c9c3b6" stroke-width="1.25"/><line x1="396" x2="720" y1="80" y2="80" stroke="#c9c3b6"/><text x="412" y="70" font-size="12.5" fill="#1f2328" font-weight="600">Thread 2</text><text x="72" y="102" font-size="12" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">lock(m);</text><text x="72" y="124" font-size="12" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">bool ok = (ptr != NULL); // check</text><text x="72" y="146" font-size="12" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">unlock(m);</text><text x="412" y="168" font-size="12" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">lock(m);</text><text x="412" y="190" font-size="12" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">ptr = NULL;</text><text x="72" y="190" font-size="12" fill="#5b6470" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">// (paused here)</text><text x="412" y="212" font-size="12" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">unlock(m);</text><text x="72" y="234" font-size="12" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">lock(m);</text><text x="72" y="256" font-size="12" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">use(ptr-&gt;field); // CRASH: NULL</text><text x="72" y="278" font-size="12" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">unlock(m);</text><text x="32" y="70" font-size="11.5" fill="#5b6470" text-anchor="middle">step</text><text x="32" y="102" font-size="11.5" fill="#5b6470" text-anchor="middle">1</text><text x="32" y="124" font-size="11.5" fill="#5b6470" text-anchor="middle">2</text><text x="32" y="146" font-size="11.5" fill="#5b6470" text-anchor="middle">3</text><text x="32" y="168" font-size="11.5" fill="#5b6470" text-anchor="middle">4</text><text x="32" y="190" font-size="11.5" fill="#5b6470" text-anchor="middle">5</text><text x="32" y="212" font-size="11.5" fill="#5b6470" text-anchor="middle">6</text><text x="32" y="234" font-size="11.5" fill="#5b6470" text-anchor="middle">7</text><text x="32" y="256" font-size="11.5" fill="#5b6470" text-anchor="middle">8</text><text x="32" y="278" font-size="11.5" fill="#5b6470" text-anchor="middle">9</text></svg>