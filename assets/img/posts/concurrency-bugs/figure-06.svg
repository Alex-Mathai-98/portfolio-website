<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 268" width="760" role="img" aria-label="The check and the act are each locked, but not together" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5"><rect width="760" height="268" fill="#ffffff"/><text x="24" y="28" font-size="15" fill="#1f2328" font-weight="600">The check and the act are each locked, but not together</text><rect x="56" y="123" width="664" height="22" fill="#2a78d6" fill-opacity="0.12"/><rect x="56" y="167" width="664" height="22" fill="#2a78d6" fill-opacity="0.12"/><rect x="56" y="48" width="664" height="196" rx="8" fill="none" stroke="#c9c3b6" stroke-width="1.25"/><text x="32" y="72" font-size="11.5" fill="#5b6470" text-anchor="middle">1</text><text x="72" y="72" font-size="12" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">int balance = 100;</text><text x="450" y="72" font-size="12" fill="#5b6470" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">// shared; every access under lock m</text><text x="32" y="94" font-size="11.5" fill="#5b6470" text-anchor="middle">2</text><text x="32" y="116" font-size="11.5" fill="#5b6470" text-anchor="middle">3</text><text x="72" y="116" font-size="12" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">void withdraw(int amt) {</text><text x="450" y="116" font-size="12" fill="#5b6470" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">// both threads call withdraw(80)</text><text x="32" y="138" font-size="11.5" fill="#5b6470" text-anchor="middle">4</text><text x="96" y="138" font-size="12" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">lock(m); int b = balance; unlock(m);</text><text x="450" y="138" font-size="12" fill="#1f2328" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">// CHECK</text><text x="32" y="160" font-size="11.5" fill="#5b6470" text-anchor="middle">5</text><text x="96" y="160" font-size="12" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">if (b &gt;= amt) {</text><text x="32" y="182" font-size="11.5" fill="#5b6470" text-anchor="middle">6</text><text x="120" y="182" font-size="12" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">lock(m); balance -= amt; unlock(m);</text><text x="450" y="182" font-size="12" fill="#1f2328" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">// ACT</text><text x="32" y="204" font-size="11.5" fill="#5b6470" text-anchor="middle">7</text><text x="96" y="204" font-size="12" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">}</text><text x="32" y="226" font-size="11.5" fill="#5b6470" text-anchor="middle">8</text><text x="72" y="226" font-size="12" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">}</text></svg>