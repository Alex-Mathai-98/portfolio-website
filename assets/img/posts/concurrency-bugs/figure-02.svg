<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 206" width="760" role="img" aria-label="Both threads read 0, so one increment is lost: count ends at 1, not 2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5"><rect width="760" height="206" fill="#ffffff"/><text x="24" y="28" font-size="15" fill="#1f2328" font-weight="600">Both threads read 0, so one increment is lost: count ends at 1, not 2</text><rect x="336" y="153" width="264" height="22" fill="#e8a33d" fill-opacity="0.22"/><rect x="616" y="153" width="104" height="22" fill="#e8a33d" fill-opacity="0.22"/><rect x="56" y="48" width="264" height="134" rx="8" fill="none" stroke="#c9c3b6" stroke-width="1.25"/><line x1="56" x2="320" y1="80" y2="80" stroke="#c9c3b6"/><text x="72" y="70" font-size="12.5" fill="#1f2328" font-weight="600">Thread 1</text><rect x="336" y="48" width="264" height="134" rx="8" fill="none" stroke="#c9c3b6" stroke-width="1.25"/><line x1="336" x2="600" y1="80" y2="80" stroke="#c9c3b6"/><text x="352" y="70" font-size="12.5" fill="#1f2328" font-weight="600">Thread 2</text><text x="72" y="102" font-size="12" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">r1 = count;  // reads 0</text><text x="352" y="124" font-size="12" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">r2 = count;  // reads 0</text><text x="72" y="146" font-size="12" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">count = r1 + 1;  // writes 1</text><text x="352" y="168" font-size="12" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">count = r2 + 1;  // writes 1</text><rect x="616" y="48" width="104" height="134" rx="8" fill="none" stroke="#c9c3b6" stroke-width="1.25"/><line x1="616" x2="720" y1="80" y2="80" stroke="#c9c3b6"/><text x="668.0" y="70" font-size="12" fill="#1f2328" font-weight="600" text-anchor="middle">count</text><text x="668.0" y="102" font-size="12" fill="#1f2328" text-anchor="middle">0</text><text x="668.0" y="124" font-size="12" fill="#1f2328" text-anchor="middle">0</text><text x="668.0" y="146" font-size="12" fill="#1f2328" text-anchor="middle">1</text><text x="668.0" y="168" font-size="11.5" fill="#1f2328" font-weight="600" text-anchor="middle">1 (should be 2)</text><text x="32" y="70" font-size="11.5" fill="#5b6470" text-anchor="middle">step</text><text x="32" y="102" font-size="11.5" fill="#5b6470" text-anchor="middle">1</text><text x="32" y="124" font-size="11.5" fill="#5b6470" text-anchor="middle">2</text><text x="32" y="146" font-size="11.5" fill="#5b6470" text-anchor="middle">3</text><text x="32" y="168" font-size="11.5" fill="#5b6470" text-anchor="middle">4</text></svg>