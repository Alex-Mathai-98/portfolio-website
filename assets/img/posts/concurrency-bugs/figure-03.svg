<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 158" width="760" role="img" aria-label="The lock turns load-add-store into one uninterruptible unit" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5"><rect width="760" height="158" fill="#ffffff"/><text x="24" y="28" font-size="15" fill="#1f2328" font-weight="600">The lock turns load-add-store into one uninterruptible unit</text><rect x="56" y="79" width="664" height="22" fill="#2a78d6" fill-opacity="0.12"/><rect x="56" y="48" width="664" height="86" rx="8" fill="none" stroke="#c9c3b6" stroke-width="1.25"/><text x="32" y="72" font-size="11.5" fill="#5b6470" text-anchor="middle">1</text><text x="72" y="72" font-size="12" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">pthread_mutex_lock(&amp;m);</text><text x="300" y="72" font-size="12" fill="#5b6470" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">// take the lock; other threads wait here</text><text x="32" y="94" font-size="11.5" fill="#5b6470" text-anchor="middle">2</text><text x="72" y="94" font-size="12" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">count++;</text><text x="300" y="94" font-size="12" fill="#5b6470" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">// load-add-store can no longer be split</text><text x="32" y="116" font-size="11.5" fill="#5b6470" text-anchor="middle">3</text><text x="72" y="116" font-size="12" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">pthread_mutex_unlock(&amp;m);</text><text x="300" y="116" font-size="12" fill="#5b6470" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">// release; one waiting thread may enter</text></svg>